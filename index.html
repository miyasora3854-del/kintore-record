<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>筋トレ記録</title>

<style>

/* =========================================================

   基本

========================================================= */

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}

html,

body{

  margin:0;

  padding:0;

  height:100%;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Helvetica Neue",

    "Hiragino Kaku Gothic ProN",

    "Yu Gothic",

    sans-serif;

  background:#f5f6f8;

  color:#222;

}

body{

  overflow:hidden;

}

button,

input,

select,

textarea{

  font:inherit;

}

button{

  cursor:pointer;

}

/* =========================================================

   ヘッダー

========================================================= */

.header{

  height:58px;

  background:#fff;

  border-bottom:1px solid #ddd;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:20px;

  font-weight:700;

  position:relative;

  z-index:10;

}

.main{

  height:calc(100vh - 118px);

  overflow:hidden;

}

/* =========================================================

   ホーム

========================================================= */

.home{

  height:100%;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  padding:12px;

}

.calendar-card,

.preview-card,

.card{

  background:#fff;

  border-radius:14px;

  box-shadow:

    0 2px 8px rgba(0,0,0,.06);

}

/* =========================================================

   カレンダー

========================================================= */

.calendar-card{

  padding:12px;

  margin-bottom:12px;

}

.calendar-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:10px;

}

.calendar-title{

  font-size:18px;

  font-weight:700;

}

.month-btn{

  border:0;

  background:#f0f1f3;

  width:38px;

  height:38px;

  border-radius:10px;

  font-size:20px;

}

.week{

  display:grid;

  grid-template-columns:repeat(7,1fr);

  text-align:center;

  font-size:12px;

  color:#777;

  margin-bottom:5px;

}

.days{

  display:grid;

  grid-template-columns:repeat(7,1fr);

  gap:4px;

}

.day{

  min-height:58px;

  position:relative;

}

.day button{

  width:100%;

  height:58px;

  border:0;

  background:transparent;

  border-radius:10px;

  position:relative;

  padding:4px 2px;

}

.day button:active{

  background:#eee;

}

.day.other button{

  color:#bbb;

}

.day.today button{

  border:2px solid #222;

}

.day.selected button{

  background:#222;

  color:#fff;

}

.day-number{

  font-size:14px;

  line-height:20px;

}

.day-marks{

  font-size:11px;

  line-height:16px;

  white-space:nowrap;

  overflow:hidden;

}

.calendar-legend-mini{

  margin-top:8px;

  font-size:11px;

  color:#777;

  text-align:right;

}

/* =========================================================

   プレビュー

========================================================= */

.preview-card{

  padding:14px;

  margin-bottom:20px;

}

.preview-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;

  margin-bottom:10px;

}

.preview-date{

  font-size:18px;

  font-weight:700;

  white-space:nowrap;

}

.primary-btn{

  border:0;

  background:#222;

  color:#fff;

  border-radius:10px;

  padding:9px 13px;

  font-weight:700;

}

.secondary-btn{

  border:0;

  background:#eee;

  color:#222;

  border-radius:10px;

  padding:9px 13px;

  font-weight:600;

}

.preview-scroll{

  max-height:55vh;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  padding-right:2px;

}

.empty{

  color:#888;

  text-align:center;

  padding:30px 10px;

}

/* =========================================================

   予定

========================================================= */

.plan-box{

  background:#f3f4f6;

  border-radius:10px;

  padding:10px;

  margin-bottom:10px;

}

.plan-title{

  font-weight:700;

  margin-bottom:5px;

}

/* =========================================================

   記録プレビュー

========================================================= */

.workout-preview{

  border:1px solid #e1e1e1;

  border-radius:12px;

  padding:12px;

  margin-bottom:10px;

}

.workout-header{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:8px;

  margin-bottom:6px;

}

.workout-title{

  font-size:16px;

  font-weight:700;

  margin-bottom:4px;

}

.workout-sub{

  color:#777;

  font-size:12px;

  margin-bottom:6px;

}

.edit-btn{

  flex-shrink:0;

  border:0;

  background:#eee;

  color:#222;

  border-radius:8px;

  padding:6px 9px;

  font-size:12px;

  font-weight:600;

}

/* =========================================================

   セット表示

========================================================= */

.set-row{

  display:grid;

  grid-template-columns:55px 1fr 1fr;

  gap:6px;

  padding:5px 0;

  border-bottom:1px solid #eee;

  font-size:14px;

  white-space:nowrap;

}

.set-row:last-child{

  border-bottom:0;

}

/* =========================================================

   メモ

========================================================= */

.memo-box{

  background:#fff8dc;

  border-radius:10px;

  padding:8px 11px;

  margin-top:6px;

  white-space:pre-wrap;

}

.memo-title{

  font-weight:700;

  margin-bottom:3px;

}

/* =========================================================

   下部タブ

========================================================= */

.bottom-nav{

  height:60px;

  background:#fff;

  border-top:1px solid #ddd;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  z-index:20;

}

.bottom-nav button{

  border:0;

  background:#fff;

  color:#777;

  font-size:11px;

}

.bottom-nav button.active{

  color:#111;

  font-weight:700;

}

.nav-icon{

  display:block;

  font-size:20px;

  margin-bottom:2px;

}

/* =========================================================

   共通画面

========================================================= */

.page{

  height:100%;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  padding:12px;

}

.section-title{

  font-size:18px;

  font-weight:700;

  margin:8px 2px 12px;

}

.card{

  padding:14px;

  margin-bottom:12px;

}

.row{

  display:flex;

  gap:8px;

  align-items:center;

}

.row-between{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;

}

.form-group{

  margin-bottom:12px;

}

label{

  display:block;

  font-size:13px;

  color:#666;

  margin-bottom:5px;

}

input,

select,

textarea{

  width:100%;

  border:1px solid #ccc;

  border-radius:9px;

  padding:10px;

  background:#fff;

}

textarea{

  min-height:100px;

  resize:vertical;

}

.small-btn{

  border:0;

  border-radius:8px;

  padding:7px 10px;

  background:#eee;

}

.danger{

  background:#ffe4e4;

  color:#b00000;

}

.item{

  border:1px solid #ddd;

  border-radius:10px;

  padding:11px;

  margin-bottom:8px;

}

/* =========================================================

   モーダル

========================================================= */

.modal{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.5);

  display:none;

  align-items:flex-end;

  justify-content:center;

  z-index:100;

}

.modal.show{

  display:flex;

}

.modal-box{

  width:100%;

  max-width:600px;

  max-height:92vh;

  overflow-y:auto;

  background:#fff;

  border-radius:18px 18px 0 0;

  padding:16px;

  animation:slideUp .2s ease;

}

@keyframes slideUp{

  from{

    transform:translateY(30px);

    opacity:.5;

  }

  to{

    transform:translateY(0);

    opacity:1;

  }

}

.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:15px;

}

.modal-title{

  font-size:19px;

  font-weight:700;

}

.modal-close{

  border:0;

  background:#eee;

  width:36px;

  height:36px;

  border-radius:50%;

  font-size:20px;

}

.modal-actions{

  display:flex;

  gap:8px;

  margin-top:15px;

}

.modal-actions button{

  flex:1;

}

/* =========================================================

   部位 → 種目

========================================================= */

.exercise-select-note{

  font-size:12px;

  color:#777;

  margin-top:5px;

}

/* =========================================================

   セット入力

========================================================= */

.set-editor{

  border:1px solid #ddd;

  border-radius:10px;

  padding:10px;

  margin-bottom:8px;

}

.set-editor-grid{

  display:grid;

  grid-template-columns:35px 1fr 1fr 38px;

  gap:6px;

  align-items:center;

}

.remove-set{

  border:0;

  background:#ffe5e5;

  color:#b00000;

  border-radius:7px;

  height:38px;

}

.add-set{

  width:100%;

  border:1px dashed #aaa;

  background:#fafafa;

  border-radius:9px;

  padding:10px;

  margin-top:4px;

}

/* =========================================================

   種目管理

========================================================= */

.menu-section{

  margin-bottom:20px;

}

.menu-category{

  font-size:16px;

  font-weight:700;

  margin:15px 0 8px;

}

/* =========================================================

   マーク説明

========================================================= */

.mark-description{

  display:flex;

  align-items:flex-start;

  gap:10px;

  padding:9px 0;

  border-bottom:1px solid #eee;

}

.mark-description:last-child{

  border-bottom:0;

}

.mark-icon{

  font-size:20px;

  width:28px;

}

/* =========================================================

   分析

========================================================= */

.stat-grid{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:8px;

}

.stat{

  background:#f3f4f6;

  border-radius:10px;

  padding:12px;

}

.stat-value{

  font-size:22px;

  font-weight:700;

}

.stat-label{

  color:#777;

  font-size:12px;

}

canvas{

  max-width:100%;

}

/* =========================================================

   PC

========================================================= */

@media(min-width:700px){

  .home{

    max-width:800px;

    margin:auto;

  }

  .page{

    max-width:800px;

    margin:auto;

  }

  .bottom-nav{

    left:50%;

    transform:translateX(-50%);

    max-width:800px;

  }

}

</style>

</head>

<body>

<header class="header">

  筋トレ記録

</header>

<main class="main" id="app"></main>

<nav class="bottom-nav">

  <button id="nav-calendar"

          onclick="showTab('calendar')">

    <span class="nav-icon">📅</span>

    ホーム

  </button>

  <button id="nav-menu"

          onclick="showTab('menu')">

    <span class="nav-icon">🏋️</span>

    種目

  </button>

  <button id="nav-analysis"

          onclick="showTab('analysis')">

    <span class="nav-icon">📊</span>

    分析

  </button>

  <button id="nav-settings"

          onclick="showTab('settings')">

    <span class="nav-icon">⚙️</span>

    メニュー

  </button>

</nav>

<div class="modal"

     id="modal"

     onclick="modalBackground(event)">

  <div class="modal-box"

       id="modalBox">

  </div>

</div>

<script>

/* =========================================================

   データ

========================================================= */

const KEY = 'kintoreData';

const MENUKEY = 'kintoreMenus';

const PLANKEY = 'kintorePlans';

const PROFILEKEY = 'kintoreProfile';

const TEMPLATEKEY = 'kintoreTemplates';

const categories = [

  '胸',

  '背中',

  '肩',

  '腕',

  '脚',

  '腹',

  '有酸素',

  'その他'

];

const cardioExercises = [

  'ランニング',

  'ジョギング',

  'ウォーキング',

  'サイクリング',

  '水泳',

  'その他'

];

const defaultMenus = {

  '胸': [

    'ベンチプレス',

    'チェストプレス',

    'ダンベルプレス',

    'ディップス'

  ],

  '背中': [

    '懸垂',

    'ラットプルダウン',

    'ローイング',

    'ワンハンドロー'

  ],

  '肩': [

    'ショルダープレス',

    'サイドレイズ',

    'フロントレイズ'

  ],

  '腕': [

    'アームカール',

    'ハンマーカール',

    'トライセプスプレスダウン'

  ],

  '脚': [

    'スクワット',

    'スミスマシンスクワット',

    'レッグプレス',

    'レッグカール',

    'カーフレイズ'

  ],

  '腹': [

    'アブドミナル',

    'レッグレイズ',

    'ケーブルクランチ'

  ],

  '有酸素': cardioExercises,

  'その他': [

    'その他'

  ]

};

let data = loadJSON(KEY,{});

let menus = loadJSON(MENUKEY,{});

let plans = loadJSON(PLANKEY,{});

let profile = loadJSON(PROFILEKEY,{

  name:'自分',

  height:'',

  weight:''

});

let templates = loadJSON(TEMPLATEKEY,{});

mergeDefaultMenus();

let state = {

  tab:'calendar',

  date:isoToday(),

  month:new Date(),

  modalWorkout:null,

  modalEditIndex:null

};

/* =========================================================

   基本関数

========================================================= */

function loadJSON(key,fallback){

  try{

    const value =

      localStorage.getItem(key);

    return value

      ? JSON.parse(value)

      : fallback;

  }catch(e){

    return fallback;

  }

}

function saveJSON(key,value){

  localStorage.setItem(

    key,

    JSON.stringify(value)

  );

}

function saveAll(){

  saveJSON(KEY,data);

  saveJSON(MENUKEY,menus);

  saveJSON(PLANKEY,plans);

  saveJSON(PROFILEKEY,profile);

  saveJSON(TEMPLATEKEY,templates);

}

function mergeDefaultMenus(){

  for(const cat of categories){

    if(!Array.isArray(menus[cat])){

      menus[cat] = [];

    }

    for(const exercise of defaultMenus[cat]){

      if(!menus[cat].includes(exercise)){

        menus[cat].push(exercise);

      }

    }

  }

}

function isoToday(){

  const d = new Date();

  return localDate(d);

}

function localDate(d){

  const y = d.getFullYear();

  const m =

    String(d.getMonth()+1)

      .padStart(2,'0');

  const day =

    String(d.getDate())

      .padStart(2,'0');

  return `${y}-${m}-${day}`;

}

function esc(str){

  return String(str ?? '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');

}

function formatDate(date){

  const d =

    new Date(date + 'T00:00:00');

  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

}

function getRecord(date){

  if(!data[date]){

    return {

      workouts:[],

      memo:''

    };

  }

  return {

    workouts:

      Array.isArray(data[date].workouts)

        ? data[date].workouts

        : [],

    memo:data[date].memo || ''

  };

}

function hasWorkout(date){

  return getRecord(date)

    .workouts.length > 0;

}

function hasMemo(date){

  return !!getRecord(date)

    .memo

    .trim();

}

function hasPlan(date){

  return Array.isArray(plans[date])

    && plans[date].length > 0;

}

/* =========================================================

   タブ

========================================================= */

function showTab(tab){

  state.tab = tab;

  document

    .querySelectorAll('.bottom-nav button')

    .forEach(b=>{

      b.classList.remove('active');

    });

  const nav =

    document.getElementById(

      'nav-' +

      (tab === 'calendar'

        ? 'calendar'

        : tab)

    );

  if(nav){

    nav.classList.add('active');

  }

  render();

}

/* =========================================================

   描画

========================================================= */

function render(){

  const app =

    document.getElementById('app');

  if(state.tab === 'calendar'){

    app.innerHTML =

      renderHome();

  }

  if(state.tab === 'menu'){

    app.innerHTML =

      renderMenu();

  }

  if(state.tab === 'analysis'){

    app.innerHTML =

      renderAnalysis();

    setTimeout(

      drawWeightChart,

      50

    );

  }

  if(state.tab === 'settings'){

    app.innerHTML =

      renderSettings();

  }

}

/* =========================================================

   ホーム

========================================================= */

function renderHome(){

  return `

    <div class="home">

      ${renderCalendar()}

      ${renderHomePreview()}

    </div>

  `;

}

/* =========================================================

   カレンダー

========================================================= */

function renderCalendar(){

  const year =

    state.month.getFullYear();

  const month =

    state.month.getMonth();

  const first =

    new Date(

      year,

      month,

      1

    );

  const last =

    new Date(

      year,

      month + 1,

      0

    );

  const startDay =

    first.getDay();

  const totalDays =

    last.getDate();

  let html = `

    <div class="calendar-card">

      <div class="calendar-head">

        <button

          class="month-btn"

          onclick="moveMonth(-1)">

          ‹

        </button>

        <div class="calendar-title">

          ${year}年${month+1}月

        </div>

        <button

          class="month-btn"

          onclick="moveMonth(1)">

          ›

        </button>

      </div>

      <div class="week">

        <div>日</div>

        <div>月</div>

        <div>火</div>

        <div>水</div>

        <div>木</div>

        <div>金</div>

        <div>土</div>

      </div>

      <div class="days">

  `;

  /* 前月 */

  for(

    let i=0;

    i<startDay;

    i++

  ){

    const d =

      new Date(

        year,

        month,

        i-startDay+1

      );

    html +=

      renderDay(d,true);

  }

  /* 当月 */

  for(

    let i=1;

    i<=totalDays;

    i++

  ){

    const d =

      new Date(

        year,

        month,

        i

      );

    html +=

      renderDay(d,false);

  }

  /* 翌月 */

  const totalCells =

    startDay + totalDays;

  const remain =

    (7 - totalCells % 7) % 7;

  for(

    let i=1;

    i<=remain;

    i++

  ){

    const d =

      new Date(

        year,

        month+1,

        i

      );

    html +=

      renderDay(d,true);

  }

  html += `

      </div>

      <div class="calendar-legend-mini">

        🔥記録　📅予定　📝メモ

      </div>

    </div>

  `;

  return html;

}

function renderDay(d,other){

  const date =

    localDate(d);

  const today =

    isoToday() === date;

  const selected =

    state.date === date;

  let cls = 'day';

  if(other){

    cls += ' other';

  }

  if(today){

    cls += ' today';

  }

  if(selected){

    cls += ' selected';

  }

  let marks = '';

  if(hasWorkout(date)){

    marks += '🔥';

  }

  if(hasPlan(date)){

    marks += '📅';

  }

  if(hasMemo(date)){

    marks += '📝';

  }

  return `

    <div class="${cls}">

      <button

        onclick="openDate('${date}')">

        <div class="day-number">

          ${d.getDate()}

        </div>

        <div class="day-marks">

          ${marks}

        </div>

      </button>

    </div>

  `;

}

function openDate(date){

  state.date = date;

  const d =

    new Date(

      date + 'T00:00:00'

    );

  if(

    d.getMonth() !==

      state.month.getMonth()

    ||

    d.getFullYear() !==

      state.month.getFullYear()

  ){

    state.month =

      new Date(

        d.getFullYear(),

        d.getMonth(),

        1

      );

  }

  render();

}

function moveMonth(diff){

  state.month =

    new Date(

      state.month.getFullYear(),

      state.month.getMonth()+diff,

      1

    );

  render();

}

/* =========================================================

   ホーム：プレビュー

========================================================= */

function renderHomePreview(){

  const record =

    getRecord(state.date);

  const planned =

    plans[state.date] || [];

  let body = '';

  /* 予定 */

  if(planned.length){

    body += `

      <div class="plan-box">

        <div class="plan-title">

          📅 予定

        </div>

        <div>

          ${planned.map(esc).join(' / ')}

        </div>

      </div>

    `;

  }

  /* 記録 */

  if(record.workouts.length){

    record.workouts.forEach((w,i)=>{

      body +=

        homeWorkoutHTML(w,i);

    });

  }

  /* 記録なし */

  if(

    !record.workouts.length

    &&

    !planned.length

  ){

    body += `

      <div class="empty">

        この日の記録はありません

      </div>

    `;

  }

  /* 日のメモ */

  if(record.memo){

    body += `

      <div class="memo-box">

        <div class="memo-title">

          📝 メモ

        </div>

        ${esc(record.memo)}

      </div>

    `;

  }

  return `

    <div class="preview-card">

      <div class="preview-head">

        <div class="preview-date">

          ${formatDate(state.date)}

        </div>

        <div class="row">

          <button

            class="secondary-btn"

            onclick="openDayMemoModal()">

            📝 メモ

          </button>

    cat;

    menus[cat] || [];

    list[0] || '';

  if(cat === '有酸素'){

    state.modalWorkout.time =

      state.modalWorkout.time || '';

  }

  else{

    if(

      !Array.isArray(

        state.modalWorkout.sets

      )

    ){

      state.modalWorkout.sets = [

        {

          weight:'',

          reps:''

        },

        {

          weight:'',

          reps:''

        },

        {

          weight:'',

          reps:''

        }

      ];

    }

  }

}

/* =========================================================

   モーダル入力内容を保存

========================================================= */

function syncWorkoutModal(){

  if(!state.modalWorkout){

    return;

  }

  const catEl =

    document.getElementById(

      'modal-category'

    );

  const exerciseEl =

    document.getElementById(

      'modal-exercise'

    );

  if(catEl){

    state.modalWorkout.cat =

      catEl.value;

  }

  if(exerciseEl){

    state.modalWorkout.exercise =

      exerciseEl.value;

  }

  const equipEl =

    document.getElementById(

      'modal-equip'

    );

  if(equipEl){

    state.modalWorkout.equip =

      equipEl.value;

  }

  const timeEl =

    document.getElementById(

      'modal-time'

    );

  if(timeEl){

    state.modalWorkout.time =

      timeEl.value;

  }

  const memoEl =

    document.getElementById(

      'modal-workout-memo'

    );

  if(memoEl){

    state.modalWorkout.memo =

      memoEl.value;

  }

  if(

    state.modalWorkout.cat !==

    '有酸素'

  ){

    const sets = [];

    let i = 0;

    while(

      document.getElementById(

        `modal-weight-${i}`

      )

    ){

      sets.push({

        weight:

          document

            .getElementById(

              `modal-weight-${i}`

            )

            .value,

        reps:

          document

            .getElementById(

              `modal-reps-${i}`

            )

            .value

      });

      i++;

    }

    state.modalWorkout.sets =

      sets;

  }

}

/* =========================================================

   セット追加

========================================================= */

function modalAddSet(){

  syncWorkoutModal();

  if(

    !Array.isArray(

      state.modalWorkout.sets

    )

  ){

    state.modalWorkout.sets = [];

  }

  state.modalWorkout.sets.push({

    weight:'',

    reps:''

  });

  renderWorkoutModal();

}

/* =========================================================

   セット削除

========================================================= */

function modalRemoveSet(index){

  syncWorkoutModal();

  if(

    state.modalWorkout.sets.length <= 1

  ){

    alert(

      'セットは1つ以上残してください。'

    );

    return;

  }

  state.modalWorkout.sets.splice(

    index,

    1

  );

  renderWorkoutModal();

}

/* =========================================================

   記録保存

========================================================= */

function saveWorkoutModal(){

  syncWorkoutModal();

  const w =

    state.modalWorkout;

  if(!w.exercise){

    alert(

      '種目を選択してください。'

    );

    return;

  }

  if(w.cat === '有酸素'){

    if(!w.time){

      alert(

        '時間を入力してください。'

      );

      return;

    }

  }

  else{

    w.sets =

      (w.sets || []).map(s=>({

        weight:

          String(s.weight || ''),

        reps:

          String(s.reps || '')

      }));

  }

  if(!data[state.date]){

    data[state.date] = {

      workouts:[],

      memo:''

    };

  }

  /* 新規 */

  if(

    state.modalEditIndex === null

  ){

    data[state.date]

      .workouts

      .push(w);

  }

  /* 編集 */

  else{

    data[state.date]

      .workouts[

        state.modalEditIndex

      ] = w;

  }

  saveJSON(

    KEY,

    data

  );

  closeModal();

  render();

}

/* =========================================================

   記録削除

========================================================= */

function deleteWorkoutFromModal(){

  if(

    state.modalEditIndex === null

  ){

    return;

  }

  if(

    !confirm(

      'この記録を削除しますか？'

    )

  ){

    return;

  }

  const record =

    getRecord(state.date);

  record.workouts.splice(

    state.modalEditIndex,

    1

  );

  data[state.date] =

    record;

  saveJSON(

    KEY,

    data

  );

  closeModal();

  render();

}

    MENUKEY,

    menus

  );

  dates.forEach(date=>{

    const record =

      getRecord(date);

    totalWorkouts +=

      record.workouts.length;

  return `

/* =========================================================

========================================================= */

function exportData(){

  const all = {

    data,

    menus,

    plans,

    profile,

    templates

  };

  const blob =

    new Blob(

      [

        JSON.stringify(

          all,

          null,

          2

        )

      ],

      {

        type:

          'application/json'

      }

    );

  const url =

    URL.createObjectURL(

      blob

    );

  const a =

    document.createElement(

      'a'

    );

  a.href =

    url;

  a.download =

    `筋トレ記録_${isoToday()}.json`;

  a.click();

  URL.revokeObjectURL(

    url

  );

}

/* =========================================================

   データ読み込み

========================================================= */

function importData(){

  const input =

    document.createElement(

      'input'

    );

  input.type =

    'file';

  input.accept =

    '.json';

  input.onchange =

    e=>{

      const file =

        e.target.files[0];

      if(!file){

        return;

      }

      const reader =

        new FileReader();

      reader.onload =

        ()=>{

          try{

            const obj =

              JSON.parse(

                reader.result

              );

            if(obj.data){

              data =

                obj.data;

            }

            if(obj.menus){

              menus =

                obj.menus;

            }

            if(obj.plans){

              plans =

                obj.plans;

            }

            if(obj.profile){

              profile =

                obj.profile;

            }

            if(obj.templates){

              templates =

                obj.templates;

            }

            mergeDefaultMenus();

            saveAll();

            alert(

              'データを読み込みました。'

            );

            render();

          }

          catch(err){

            alert(

              'データを読み込めませんでした。'

            );

          }

        };

      reader.readAsText(

        file

      );

    };

  input.click();

}

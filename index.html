<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111827">

<title>筋トレ記録 V2</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,

  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;

  background:#f4f5f7;

  color:#111827;

}

button,input,select,textarea{font:inherit}

button{cursor:pointer;border:0}

.app{

  max-width:760px;

  margin:auto;

  min-height:100vh;

  padding-bottom:75px;

}

header{

  background:#111827;

  color:white;

  padding:17px 18px 14px;

  position:sticky;

  top:0;

  z-index:10;

}

.title{

  font-size:21px;

  font-weight:800;

}

.sub{

  font-size:12px;

  opacity:.7;

  margin-top:3px;

}

main{padding:12px}

.card{

  background:white;

  border-radius:16px;

  padding:15px;

  margin-bottom:12px;

  box-shadow:0 2px 10px #0000000b;

}

h2{

  font-size:18px;

  margin:0 0 12px;

}

h3{

  font-size:15px;

  margin:0 0 10px;

}

.row{

  display:flex;

  gap:8px;

  align-items:center;

}

.between{

  justify-content:space-between;

}

.wrap{flex-wrap:wrap}

.btn{

  padding:10px 14px;

  border-radius:11px;

  background:#111827;

  color:white;

  font-weight:700;

}

.btn.secondary{

  background:#e5e7eb;

  color:#111827;

}

.btn.danger{

  background:#fee2e2;

  color:#991b1b;

}

.btn.small{

  padding:7px 10px;

  font-size:13px;

}

input,select,textarea{

  width:100%;

  padding:10px 11px;

  border:1px solid #d1d5db;

  border-radius:10px;

  background:white;

}

textarea{

  min-height:80px;

  resize:vertical;

}

label{

  display:block;

  font-size:12px;

  color:#6b7280;

  margin:9px 0 5px;

}

/* =========================

   カレンダー

========================= */

.calendar-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:10px;

}

.month{

  font-weight:800;

  font-size:18px;

}

.week,

.calendar{

  display:grid;

  grid-template-columns:repeat(7,1fr);

  gap:4px;

}

.week div{

  text-align:center;

  font-size:11px;

  color:#6b7280;

  padding:4px;

}

.day{

  min-height:67px;

  background:#fafafa;

  border:1px solid #eee;

  border-radius:10px;

  padding:5px;

  position:relative;

}

.day button{

  width:100%;

  height:100%;

  min-height:57px;

  background:transparent;

  text-align:left;

  padding:0;

}

.day.muted{

  opacity:.25;

}

.day.today{

  outline:2px solid #111827;

}

.day.selected{

  background:#eef2ff;

}

.num{

  font-weight:800;

  font-size:12px;

}

.marks{

  display:flex;

  flex-wrap:wrap;

  gap:1px;

  margin-top:6px;

  font-size:12px;

}

.mark{

  line-height:1;

}

/* =========================

   ホーム詳細

========================= */

.home-details{

  margin-top:10px;

}

.date-title{

  font-size:20px;

  font-weight:800;

}

.exercise-card{

  border:1px solid #e5e7eb;

  border-radius:13px;

  padding:12px;

  margin:10px 0;

}

.pill{

  display:inline-block;

  background:#eef2ff;

  border-radius:999px;

  padding:4px 8px;

  font-size:11px;

  margin:2px;

}

.set{

  display:grid;

  grid-template-columns:35px 1fr 1fr 38px;

  gap:6px;

  align-items:center;

  margin-bottom:7px;

}

.setno{

  font-weight:800;

  color:#6b7280;

  text-align:center;

}

.empty{

  text-align:center;

  color:#6b7280;

  padding:25px 5px;

}

.notice{

  background:#fff7ed;

  border:1px solid #fed7aa;

  border-radius:12px;

  padding:11px;

  font-size:13px;

}

.memo-box{

  margin-top:10px;

}

/* =========================

   タブ

========================= */

.tabs{

  position:fixed;

  bottom:0;

  left:0;

  right:0;

  background:white;

  border-top:1px solid #ddd;

  z-index:20;

  display:flex;

  justify-content:center;

}

.tabs button{

  flex:1;

  max-width:190px;

  background:white;

  padding:9px 4px 11px;

  color:#6b7280;

  font-size:12px;

}

.tabs button.active{

  color:#111827;

  font-weight:800;

}

.tabs b{

  display:block;

  font-size:19px;

  margin-bottom:2px;

}

/* =========================

   モーダル

========================= */

.modal{

  position:fixed;

  inset:0;

  background:#0008;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:16px;

  z-index:100;

}

.modal-box{

  background:white;

  width:min(560px,100%);

  max-height:90vh;

  overflow:auto;

  border-radius:18px;

  padding:18px;

  box-shadow:0 20px 60px #0005;

}

.modal-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:8px;

}

.modal-close{

  background:#f3f4f6;

  border-radius:50%;

  width:36px;

  height:36px;

  font-size:22px;

}

/* =========================

   分析

========================= */

.statgrid{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:9px;

}

.stat{

  background:#f9fafb;

  border-radius:12px;

  padding:12px;

}

.stat strong{

  font-size:20px;

  display:block;

}

.muted{

  color:#6b7280;

  font-size:12px;

}

.canvas-wrap{

  width:100%;

  height:280px;

}

.canvas-wrap canvas{

  width:100%;

  height:100%;

}

/* =========================

   エラー表示

========================= */

#errorBox{

  display:none;

  margin:12px;

  padding:14px;

  border-radius:12px;

  background:#fee2e2;

  color:#991b1b;

  font-size:13px;

  white-space:pre-wrap;

}

</style>

</head>

<body>

<div class="app">

<header>

  <div class="title">🏋️ 筋トレ記録</div>

  <div class="sub" id="headerSub">トレーニングを記録</div>

</header>

<div id="errorBox"></div>

<main id="main"></main>

<div id="modalRoot"></div>

<nav class="tabs">

<button data-tab="calendar" onclick="showTab('calendar')">

  <b>🏠</b>

  ホーム

</button>

<button data-tab="menu" onclick="showTab('menu')">

  <b>📋</b>

  種目

</button>

<button data-tab="analysis" onclick="showTab('analysis')">

  <b>📊</b>

  分析

</button>

<button data-tab="settings" onclick="showTab('settings')">

  <b>⚙️</b>

  メニュー

</button>

</nav>

</div>

<script>

/* =====================================================

   基本設定

===================================================== */

const KEY="kintoreDataV2";

const MENUKEY="kintoreMenusV2";

const PROFILEKEY="kintoreProfileV2";

const cats=[

  "胸","背中","肩","腕","脚","腹","有酸素","その他"

];

const cardio=[

  "ランニング",

  "ジョギング",

  "ウォーキング",

  "サイクリング",

  "水泳",

  "その他"

];

const defaults=[

 ["胸","ベンチプレス","バーベル"],

 ["胸","チェストプレス","マシン"],

 ["胸","ダンベルプレス","ダンベル"],

 ["胸","ディップス","自重"],

 ["背中","懸垂","自重"],

 ["背中","ラットプルダウン","マシン"],

 ["背中","ローイング","マシン"],

 ["背中","ワンハンドロー","ダンベル"],

 ["肩","ショルダープレス","マシン"],

 ["肩","サイドレイズ","ダンベル"],

 ["肩","フロントレイズ","ダンベル"],

 ["腕","アームカール","マシン"],

 ["腕","ハンマーカール","ダンベル"],

 ["腕","トライセプスプレスダウン","ケーブル"],

 ["脚","スクワット","バーベル"],

 ["脚","スミスマシンスクワット","スミス"],

 ["脚","レッグプレス","マシン"],

 ["脚","レッグカール","マシン"],

 ["脚","カーフレイズ","スミス"],

 ["腹","アブドミナル","マシン"],

 ["腹","レッグレイズ","自重"],

 ["腹","ケーブルクランチ","ケーブル"],

 ...cardio.map(x=>["有酸素",x,"有酸素"]),

 ["その他","その他","その他"]

];

/* =====================================================

   ユーティリティ

===================================================== */

function loadJSON(key,fallback){

  try{

    const value=localStorage.getItem(key);

    if(!value)return fallback;

    const parsed=JSON.parse(value);

    return parsed;

  }catch(error){

    console.error(error);

    return fallback;

  }

}

function saveJSON(key,value){

  try{

    localStorage.setItem(

      key,

      JSON.stringify(value)

    );

    return true;

  }catch(error){

    console.error(error);

    return false;

  }

}

function isoToday(){

  const d=new Date();

  return localDate(d);

}

function localDate(d){

  return d.getFullYear()+"-"+

    String(d.getMonth()+1).padStart(2,"0")+"-"+

    String(d.getDate()).padStart(2,"0");

}

function esc(value){

  return String(value??"").replace(

    /[&<>"']/g,

    function(m){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#39;"

      }[m];

    }

  );

}

/* =====================================================

   データ

===================================================== */

let data=loadJSON(KEY,{});

if(!data || typeof data!=="object"){

  data={};

}

let menus=loadJSON(MENUKEY,[]);

if(!Array.isArray(menus)){

  menus=[];

}

function mergeDefaultMenus(){

  const existing=new Set(

    menus.map(

      m=>m.cat+"|"+m.name

    )

  );

  defaults.forEach((item,index)=>{

    const key=item[0]+"|"+item[1];

    if(!existing.has(key)){

      menus.push({

        id:"default_"+index,

        cat:item[0],

        name:item[1],

        equip:item[2]

      });

    }

  });

}

mergeDefaultMenus();

let profile=loadJSON(

  PROFILEKEY,

  {

    name:"自分",

    height:"",

    weight:""

  }

);

if(!profile || typeof profile!=="object"){

  profile={

    name:"自分",

    height:"",

    weight:""

  };

}

/* =====================================================

   状態

===================================================== */

let state={

  tab:"calendar",

  date:isoToday(),

  month:new Date(),

  analysisExercise:""

};

/* =====================================================

   保存

===================================================== */

function saveAll(){

  const a=saveJSON(KEY,data);

  const b=saveJSON(MENUKEY,menus);

  const c=saveJSON(PROFILEKEY,profile);

  if(!a || !b || !c){

    alert(

      "保存できませんでした。\n"+

      "ブラウザの保存機能が制限されている可能性があります。"

    );

    return false;

  }

  return true;

}

/* =====================================================

   画面切り替え

===================================================== */

function showTab(tab){

  state.tab=tab;

  render();

}

/* =====================================================

   メイン描画

===================================================== */

function render(){

  document.querySelectorAll(".tabs button")

  .forEach(button=>{

    button.classList.toggle(

      "active",

      button.dataset.tab===state.tab

    );

  });

  document.getElementById("headerSub")

    .textContent=

    profile.name+

    " のトレーニング記録";

  if(state.tab==="calendar"){

    renderCalendar();

  }else if(state.tab==="menu"){

    renderMenu();

  }else if(state.tab==="analysis"){

    renderAnalysis();

  }else{

    renderSettings();

  }

}

/* =====================================================

   カレンダー

===================================================== */

function renderCalendar(){

  const d=state.month;

  const year=d.getFullYear();

  const month=d.getMonth();

  const first=new Date(

    year,

    month,

    1

  );

  const last=new Date(

    year,

    month+1,

    0

  );

  const start=

    (first.getDay()+6)%7;

  let cells=[];

  for(let i=0;i<start;i++){

    cells.push(

      '<div class="day muted"></div>'

    );

  }

  for(

    let n=1;

    n<=last.getDate();

    n++

  ){

    const date=localDate(

      new Date(year,month,n)

    );

    const record=data[date];

    const marks=[];

    if(

      record &&

      Array.isArray(record.workouts) &&

      record.workouts.length

    ){

      marks.push(

        '<span class="mark">🔥</span>'

      );

    }

    if(

      record &&

      record.memo &&

      String(record.memo).trim()

    ){

      marks.push(

        '<span class="mark">📝</span>'

      );

    }

    if(

      record &&

      record.pr

    ){

      marks.push(

        '<span class="mark">🏆</span>'

      );

    }

    cells.push(`

      <div class="day

        ${date===isoToday()?"today":""}

        ${date===state.date?"selected":""}">

        <button

          onclick="openDate('${date}')">

          <div class="num">

            ${n}

          </div>

          <div class="marks">

            ${marks.join("")}

          </div>

        </button>

      </div>

    `);

  }

  document.getElementById("main").innerHTML=`

    <div class="card">

      <div class="calendar-head">

        <button

          class="btn secondary small"

          onclick="moveMonth(-1)">

          ‹

        </button>

        <div class="month">

          ${year}年${month+1}月

        </div>

        <button

          class="btn secondary small"

          onclick="moveMonth(1)">

          ›

        </button>

      </div>

      <div class="week">

        ${[

          "月","火","水","木","金","土","日"

        ].map(

          x=>`<div>${x}</div>`

        ).join("")}

      </div>

      <div class="calendar">

        ${cells.join("")}

      </div>

    </div>

    <div

      class="home-details"

      id="homeDetails">

    </div>

  `;

  renderHomeDetails();

}

/* =====================================================

   日付選択

===================================================== */

function openDate(date){

  state.date=date;

  render();

  setTimeout(()=>{

    const box=

      document.getElementById(

        "homeDetails"

      );

    if(box){

      box.scrollIntoView({

        behavior:"smooth",

        block:"start"

      });

    }

  },30);

}

function moveMonth(diff){

  state.month.setMonth(

    state.month.getMonth()+diff

  );

  render();

}

/* =====================================================

   日詳細

===================================================== */

function renderHomeDetails(){

  const box=

    document.getElementById(

      "homeDetails"

    );

  if(!box)return;

  const record=

    data[state.date] || {

      workouts:[],

      memo:"",

      pr:false

    };

  const workouts=

    Array.isArray(record.workouts)

      ?record.workouts

      :[];

  box.innerHTML=`

    <div class="card">

      <div class="row between">

        <div class="date-title">

          ${state.date.replaceAll("-","/")}

        </div>

        <button

          class="btn"

          onclick="addWorkout()">

          ＋ 記録

        </button>

      </div>

      ${

        workouts.length

        ?

        workouts.map(

          (w,i)=>

            workoutHTML(w,i)

        ).join("")

        :

        `

        <div class="empty">

          この日の記録はありません

        </div>

        `

      }

      <div class="memo-box">

        <label>

          今日のメモ

        </label>

        <textarea

          id="dayMemo"

          placeholder="体調・気づき・疲労感など"

        >${esc(record.memo||"")}</textarea>

      </div>

      <div

        class="row"

        style="margin-top:10px">

        <button

          class="btn"

          onclick="saveDay()">

          保存

        </button>

        <button

          class="btn secondary"

          onclick="copyPrevious()">

          前回コピー

        </button>

      </div>

    </div>

  `;

}

/* =====================================================

   ワークアウト表示

===================================================== */

function workoutHTML(w,index){

  if(w.cat==="有酸素"){

    return `

      <div class="exercise-card">

        <div class="row between">

          <div>

            <strong>

              ${esc(w.exercise)}

            </strong>

            <span class="pill">

              有酸素

            </span>

          </div>

          <button

            class="btn danger small"

            onclick="removeWorkout(${index})">

            削除

          </button>

        </div>

        <label>

          時間（分）

        </label>

        <input

          class="cardio-time"

          data-i="${index}"

          type="number"

          min="0"

          value="${esc(w.time||"")}"

          placeholder="例：60">

        <label>

          種目メモ

        </label>

        <textarea

          class="workout-memo"

          data-i="${index}"

          placeholder="この運動についてのメモ"

        >${esc(w.memo||"")}</textarea>

      </div>

    `;

  }

  const sets=

    Array.isArray(w.sets)

      ?w.sets

      :[];

  return `

    <div class="exercise-card">

      <div class="row between">

        <div>

          <strong>

            ${esc(w.exercise)}

          </strong>

          <span class="pill">

            ${esc(w.cat)}

          </span>

          <span class="pill">

            ${esc(w.equip)}

          </span>

        </div>

        <button

          class="btn danger small"

          onclick="removeWorkout(${index})">

          削除

        </button>

      </div>

      <div style="margin-top:10px">

        ${

          sets.map(

            (s,j)=>`

              <div class="set">

                <div class="setno">

                  ${j+1}

                </div>

                <input

                  class="weight"

                  data-i="${index}"

                  data-j="${j}"

                  type="number"

                  step="0.1"

                  value="${esc(s.weight||"")}"

                  placeholder="kg">

                <input

                  class="reps"

                  data-i="${index}"

                  data-j="${j}"

                  type="number"

                  value="${esc(s.reps||"")}"

                  placeholder="回">

                <button

                  class="btn danger small"

                  onclick="removeSet(${index},${j})">

                  ×

                </button>

              </div>

            `

          ).join("")

        }

      </div>

      <button

        class="btn secondary small"

        onclick="addSet(${index})">

        ＋ セット追加

      </button>

      <label>

        種目メモ

      </label>

      <textarea

        class="workout-memo"

        data-i="${index}"

        placeholder="この種目についてのメモ"

      >${esc(w.memo||"")}</textarea>

    </div>

  `;

}

/* =====================================================

   記録追加モーダル

===================================================== */

function addWorkout(){

  const options=

    menus.map(

      m=>`

        <option value="${esc(m.id)}">

          ${esc(m.cat)}

          ／

          ${esc(m.name)}

        </option>

      `

    ).join("");

  document.getElementById("modalRoot")

    .innerHTML=`

      <div

        class="modal"

        onclick="

          if(event.target===this)

          closeModal()

        ">

        <div class="modal-box">

          <div class="modal-head">

            <h2 style="margin:0">

              記録を追加

            </h2>

            <button

              class="modal-close"

              onclick="closeModal()">

              ×

            </button>

          </div>

          <label>

            種目

          </label>

          <select id="addExercise">

            ${options}

          </select>

          <div

            class="notice"

            style="margin-top:12px">

            筋トレは

            <strong>3セット</strong>

            から開始します。

          </div>

          <div

            class="row"

            style="

              margin-top:14px;

              justify-content:flex-end

            ">

            <button

              class="btn secondary"

              onclick="closeModal()">

              キャンセル

            </button>

            <button

              class="btn"

              onclick="confirmAddWorkout()">

              追加

            </button>

          </div>

        </div>

      </div>

    `;

}

function confirmAddWorkout(){

  const select=

    document.getElementById(

      "addExercise"

    );

  if(!select)return;

  const menu=

    menus.find(

      m=>m.id===select.value

    );

  if(!menu)return;

  if(!data[state.date]){

    data[state.date]={

      workouts:[],

      memo:"",

      pr:false

    };

  }

  if(

    !Array.isArray(

      data[state.date].workouts

    )

  ){

    data[state.date].workouts=[];

  }

  let workout;

  if(menu.cat==="有酸素"){

    workout={

      cat:menu.cat,

      exercise:menu.name,

      equip:menu.equip,

      time:"",

      memo:""

    };

  }else{

    workout={

      cat:menu.cat,

      exercise:menu.name,

      equip:menu.equip,

      sets:[

        {

          weight:"",

          reps:""

        },

        {

          weight:"",

          reps:""

        },

        {

          weight:"",

          reps:""

        }

      ],

      memo:""

    };

  }

  data[state.date].workouts.push(

    workout

  );

  saveAll();

  closeModal();

  renderHomeDetails();

}

/* =====================================================

   セット

===================================================== */

function addSet(index){

  const workout=

    data[state.date]?.workouts?.[index];

  if(!workout)return;

  if(!Array.isArray(workout.sets)){

    workout.sets=[];

  }

  workout.sets.push({

    weight:"",

    reps:""

  });

  renderHomeDetails();

}

function removeSet(index,setIndex){

  const workout=

    data[state.date]?.workouts?.[index];

  if(!workout)return;

  if(workout.sets.length<=1){

    alert(

      "セットを0件にはできません。"

    );

    return;

  }

  workout.sets.splice(

    setIndex,

    1

  );

  saveAll();

  renderHomeDetails();

}

/* =====================================================

function removeWorkout(index){

  const workout=

/* =====================================================

   日の保存

===================================================== */

function saveDay(){

  if(!data[state.date]){

    data[state.date]={

      workouts:[],

      memo:"",

      pr:false

    };

  }

  const workouts=

    data[state.date].workouts;

  document.querySelectorAll(

    ".weight"

  ).forEach(el=>{

    const i=

      Number(el.dataset.i);

    const j=

      Number(el.dataset.j);

    if(

      workouts[i] &&

      workouts[i].sets &&

      workouts[i].sets[j]

    ){

      workouts[i].sets[j].weight=

        el.value;

    }

  });

  document.querySelectorAll(

    ".reps"

  ).forEach(el=>{

    const i=

      Number(el.dataset.i);

    const j=

      Number(el.dataset.j);

    if(

      workouts[i] &&

      workouts[i].sets &&

      workouts[i].sets[j]

    ){

      workouts[i].sets[j].reps=

        el.value;

    }

  });

  document.querySelectorAll(

    ".cardio-time"

  ).forEach(el=>{

    const i=

      Number(el.dataset.i);

    if(workouts[i]){

      workouts[i].time=

        el.value;

    }

  });

  document.querySelectorAll(

    ".workout-memo"

  ).forEach(el=>{

    const i=

      Number(el.dataset.i);

    if(workouts[i]){

      workouts[i].memo=

        el.value;

    }

  });

  const memo=

    document.getElementById(

      "dayMemo"

    );

  data[state.date].memo=

    memo ? memo.value : "";

  data[state.date].pr=

    detectPR(state.date);

  saveAll();

  render();

}

/* =====================================================

   PR判定

===================================================== */

function detectPR(date){

  const record=data[date];

  if(!record)return false;

  let foundPR=false;

  const previousDates=

    Object.keys(data)

      .filter(

        d=>d<date

      )

      .sort();

  const previous=

    previousDates.map(

      d=>data[d]

    );

  const currentWorkouts=

    Array.isArray(record.workouts)

      ?record.workouts

      :[];

  currentWorkouts.forEach(workout=>{

    if(workout.cat==="有酸素")return;

    const currentMax=

      Math.max(

        ...(

          Array.isArray(workout.sets)

            ?workout.sets

            :[]

        ).map(

          s=>Number(s.weight)||0

        ),

        0

      );

    if(currentMax<=0)return;

    let oldMax=0;

    previous.forEach(r=>{

      const workouts=

        Array.isArray(r?.workouts)

          ?r.workouts

          :[];

      workouts

        .filter(

          w=>w.exercise===workout.exercise

        )

        .forEach(w=>{

          (

            Array.isArray(w.sets)

              ?w.sets

              :[]

          ).forEach(s=>{

            oldMax=Math.max(

              oldMax,

              Number(s.weight)||0

            );

          });

        });

    });

    if(currentMax>oldMax){

      foundPR=true;

    }

  });

  return foundPR;

}

/* =====================================================

   前回コピー

===================================================== */

function copyPrevious(){

  const dates=

    Object.keys(data)

      .filter(

        d=>d<state.date

      )

      .sort();

  if(!dates.length){

    alert(

      "前回の記録がありません。"

    );

    return;

  }

  const previous=

    data[dates[dates.length-1]];

  if(!previous)return;

  data[state.date]=

    JSON.parse(

      JSON.stringify(previous)

    );

  data[state.date].pr=false;

  saveAll();

  renderHomeDetails();

}

/* =====================================================

   分析

===================================================== */

function renderAnalysis(){

  const entries=

    Object.entries(data);

  const exercises=[

    ...new Set(

      entries.flatMap(

        ([,record])=>

          (

            Array.isArray(record?.workouts)

              ?record.workouts

              :[]

          )

          .filter(

            w=>w.cat!=="有酸素"

          )

          .map(

            w=>w.exercise

          )

      )

    )

  ];

  let selected=

    state.analysisExercise ||

    exercises[0] ||

    "";

  if(

    selected &&

    !exercises.includes(selected)

  ){

    selected=

      exercises[0]||"";

  }

  let sets=0;

  let volume=0;

  let trainingDays=0;

  entries.forEach(

    ([,record])=>{

      const workouts=

        Array.isArray(record?.workouts)

          ?record.workouts

          :[];

      if(workouts.length){

        trainingDays++;

      }

      workouts.forEach(w=>{

        if(w.cat==="有酸素")return;

        const arr=

          Array.isArray(w.sets)

            ?w.sets

            :[];

        arr.forEach(s=>{

          if(

            s.weight!=="" ||

            s.reps!==""

          ){

            sets++;

          }

          volume+=

            (Number(s.weight)||0)*

            (Number(s.reps)||0);

        });

      });

    }

  );

  document.getElementById(

    "main"

  ).innerHTML=`

    <div class="card">

      <h2>

        トレーニング分析

      </h2>

      <div class="statgrid">

        <div class="stat">

          <span class="muted">

            トレーニング日

          </span>

          <strong>

            ${trainingDays}

          </strong>

          日

        </div>

        <div class="stat">

          <span class="muted">

            セット数

          </span>

          <strong>

            ${sets}

          </strong>

        </div>

        <div class="stat">

          <span class="muted">

            総負荷

          </span>

          <strong>

            ${Math.round(volume).toLocaleString()}

          </strong>

          <span class="muted">

            kg

          </span>

        </div>

        <div class="stat">

          <span class="muted">

            登録種目

          </span>

          <strong>

            ${exercises.length}

          </strong>

          種目

        </div>

      </div>

    </div>

    <div class="card">

      <h2>

        種目別・重量推移

      </h2>

      ${

        exercises.length

        ?

        `

          <select

            id="analysisExercise"

            onchange="

              state.analysisExercise=this.value;

              renderAnalysis();

            ">

            ${

              exercises.map(

                e=>`

                  <option

                    value="${esc(e)}"

                    ${e===selected?"selected":""}>

                    ${esc(e)}

                  </option>

                `

              ).join("")

            }

          </select>

          <div class="canvas-wrap">

            <canvas

              id="weightChart">

            </canvas>

          </div>

        `

        :

        `

          <div class="empty">

            まだ重量記録がありません

          </div>

        `

      }

    </div>

    <div class="card">

      <h2>

        種目別MAX重量

      </h2>

      ${

        exercises.length

        ?

        exercises.map(

          e=>{

            let max=0;

            entries.forEach(

              ([,record])=>{

                const workouts=

                  Array.isArray(record?.workouts)

                    ?record.workouts

                    :[];

                workouts

                  .filter(

                    w=>w.exercise===e

                  )

                  .forEach(w=>{

                    (

                      Array.isArray(w.sets)

                        ?w.sets

                        :[]

                    ).forEach(s=>{

                      max=Math.max(

                        max,

                        Number(s.weight)||0

                      );

                    });

                  });

              }

            );

            return `

              <div

                class="row between"

                style="

                  padding:9px 0;

                  border-bottom:1px solid #eee

                ">

                <span>

                  ${esc(e)}

                </span>

                <strong>

                  ${max ? max+" kg" : "-"}

                </strong>

              </div>

            `;

          }

        ).join("")

        :

        `

          <div class="empty">

            まだありません

          </div>

        `

      }

    </div>

  `;

  if(exercises.length){

    drawWeightChart(selected);

  }

}

/* =====================================================

   グラフ

===================================================== */

function drawWeightChart(exercise){

  const canvas=

    document.getElementById(

      "weightChart"

    );

  if(!canvas)return;

  const rect=

    canvas.getBoundingClientRect();

  const dpr=

    window.devicePixelRatio||1;

  const width=

    Math.max(

      300,

      rect.width

    );

  const height=

    Math.max(

      240,

      rect.height

    );

  canvas.width=

    width*dpr;

  canvas.height=

    height*dpr;

  const ctx=

    canvas.getContext("2d");

  ctx.scale(

    dpr,

    dpr

  );

  let points=[];

  Object.keys(data)

    .sort()

    .forEach(date=>{

      const workouts=

        Array.isArray(data[date]?.workouts)

          ?data[date].workouts

          :[];

      workouts

        .filter(

          w=>w.exercise===exercise

        )

        .forEach(w=>{

          const sets=

            Array.isArray(w.sets)

              ?w.sets

              :[];

          sets.forEach(s=>{

            const value=

              Number(s.weight)||0;

            if(value>0){

              points.push({

                date:date,

                value:value

              });

            }

          });

        });

    });

  ctx.clearRect(

    0,

    0,

    width,

    height

  );

  if(!points.length){

    ctx.fillStyle="#666";

    ctx.fillText(

      "重量データがありません",

      20,

      40

    );

    return;

  }

  const max=

    Math.max(

      ...points.map(

        p=>p.value

      )

    );

  const min=

    Math.min(

      ...points.map(

        p=>p.value

      )

    );

  const range=

    Math.max(

      max-min,

      1

    );

  const left=45;

  const right=12;

  const top=20;

  const bottom=35;

  ctx.font=

    "12px -apple-system,BlinkMacSystemFont,sans-serif";

  ctx.strokeStyle="#ddd";

  ctx.fillStyle="#666";

  for(let i=0;i<=4;i++){

    const y=

      top+

      (height-top-bottom)*

      i/4;

    const value=

      max-

      range*i/4;

    ctx.beginPath();

    ctx.moveTo(

      left,

      y

    );

    ctx.lineTo(

      width-right,

      y

    );

    ctx.stroke();

    ctx.fillText(

      Math.round(value*10)/10+

      "kg",

      2,

      y+4

    );

  }

  ctx.strokeStyle="#111";

  ctx.beginPath();

  points.forEach(

    (point,index)=>{

      const x=

        left+

        (width-left-right)*

        (

          points.length===1

          ?

          .5

          :

          index/(points.length-1)

        );

      const y=

        top+

        (height-top-bottom)*

        (

          max-point.value

        )/range;

      if(index===0){

        ctx.moveTo(

          x,

          y

        );

      }else{

        ctx.lineTo(

          x,

          y

        );

      }

    }

  );

  ctx.stroke();

  ctx.fillStyle="#111";

  points.forEach(

    (point,index)=>{

      const x=

        left+

        (width-left-right)*

        (

          points.length===1

          ?

          .5

          :

          index/(points.length-1)

        );

      const y=

        top+

        (height-top-bottom)*

        (

          max-point.value

        )/range;

      ctx.beginPath();

      ctx.arc(

        x,

        y,

        3,

        0,

        Math.PI*2

      );

      ctx.fill();

    }

  );

  ctx.fillStyle="#666";

  ctx.fillText(

    points[0].date.slice(5),

    left,

    height-10

  );

  if(points.length>1){

    ctx.fillText(

      points[points.length-1].date.slice(5),

      width-50,

      height-10

    );

  }

}

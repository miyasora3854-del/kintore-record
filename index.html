<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>筋トレ記録</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;

 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

 background:#f5f5f7;

 color:#222;

 padding-bottom:80px;

}

header{

 background:#111;

 color:white;

 padding:18px;

 text-align:center;

 font-size:22px;

 font-weight:bold;

}

main{

 max-width:650px;

 margin:auto;

 padding:16px;

}

.card{

 background:white;

 border-radius:16px;

 padding:16px;

 margin-bottom:16px;

 box-shadow:0 2px 8px #0001;

}

h2{

 margin:0 0 14px;

}

h3{

 margin:14px 0 8px;

}

button{

 border:0;

 border-radius:12px;

 padding:11px 15px;

 font-size:16px;

 background:#111;

 color:white;

}

button.secondary{

 background:#777;

}

button.danger{

 background:#c62828;

}

button.small{

 font-size:14px;

 padding:8px 11px;

}

input,select{

 width:100%;

 padding:12px;

 border:1px solid #ccc;

 border-radius:10px;

 font-size:16px;

 margin:5px 0 10px;

 background:white;

}

label{

 font-size:14px;

 font-weight:bold;

}

.row{

 display:flex;

 gap:8px;

}

.row>*{

 flex:1;

}

.hidden{

 display:none!important;

}

.calendar{

 display:grid;

 grid-template-columns:repeat(7,1fr);

 gap:5px;

}

.weekday{

 text-align:center;

 font-weight:bold;

 padding:6px 0;

}

.day{

 text-align:center;

 padding:9px 2px;

 border-radius:10px;

 background:#eee;

 min-height:52px;

 cursor:pointer;

}

.today{

 background:#111;

 color:white;

 font-weight:bold;

}

.done{

 font-size:11px;

 margin-top:3px;

}

.navmonth{

 display:flex;

 justify-content:space-between;

 align-items:center;

 margin-bottom:12px;

}

.navmonth button{

 padding:8px 13px;

}

.bottomnav{

 position:fixed;

 bottom:0;

 left:0;

 right:0;

 height:68px;

 background:white;

 border-top:1px solid #ddd;

 display:grid;

 grid-template-columns:repeat(3,1fr);

 z-index:10;

}

.bottomnav button{

 background:white;

 color:#555;

 border-radius:0;

 font-size:13px;

}

.bottomnav button.active{

 color:#111;

 font-weight:bold;

}

.item{

 padding:12px 0;

 border-bottom:1px solid #eee;

}

.menu-item{

 display:flex;

 justify-content:space-between;

 align-items:center;

 gap:10px;

 padding:12px 0;

 border-bottom:1px solid #eee;

}

.menu-info{

 flex:1;

}

.menu-name{

 font-weight:bold;

 font-size:16px;

}

.menu-equipment{

 font-size:13px;

 color:#777;

 margin-top:3px;

}

.actions{

 display:flex;

 gap:5px;

}

.category-title{

 margin-top:20px;

 padding-bottom:6px;

 border-bottom:2px solid #ddd;

}

.empty{

 color:#888;

 padding:10px 0;

}

.notice{

 background:#f0f0f0;

 border-radius:10px;

 padding:10px;

 font-size:13px;

 color:#666;

 margin-bottom:15px;

}

</style>

</head>

<body>

<header>💪 筋トレ記録</header>

<main>

<!-- ================= CALENDAR ================= -->

<section id="calendarScreen">

<div class="card">

<div class="navmonth">

<button onclick="changeMonth(-1)">‹</button>

<h2 id="monthTitle"></h2>

<button onclick="changeMonth(1)">›</button>

</div>

<div class="calendar" id="calendar"></div>

</div>

<div class="card">

<h2>今日の記録</h2>

<button onclick="openToday()">今日を記録する</button>

</div>

</section>

<!-- ================= RECORD ================= -->

<section id="recordScreen" class="hidden">

<button class="secondary" onclick="showScreen('calendar')">

← カレンダー

</button>

<div class="card">

<h2 id="recordDate"></h2>

<label>部位・種類</label>

<select id="category" onchange="updateExercise()">

<option>胸</option>

<option>背中</option>

<option>肩</option>

<option>腕</option>

<option>脚</option>

<option>腹</option>

<option>有酸素</option>

<option>その他</option>

</select>

<label>種目</label>

<select id="exercise"></select>

<div id="strengthArea">

<div class="row">

<div>

<label>重量 (kg)</label>

<input id="weight" type="number" inputmode="decimal">

</div>

<div>

<label>回数</label>

<input id="reps" type="number" inputmode="numeric">

</div>

<div>

<label>セット</label>

<input id="sets" type="number" value="3" inputmode="numeric">

</div>

</div>

</div>

<div id="cardioArea" class="hidden">

<label>距離 (km)</label>

<input id="distance" type="number" step="0.1">

<label>時間（分）</label>

<input id="time" type="number">

</div>

<label>メモ</label>

<input id="memo" type="text" placeholder="今日の調子など">

<button onclick="saveRecord()">保存する</button>

</div>

<div class="card">

<h2>この日の記録</h2>

<div id="records"></div>

</div>

</section>

<!-- ================= MENU MANAGEMENT ================= -->

<section id="menuScreen" class="hidden">

<div class="card">

<h2>📋 メニュー管理</h2>

<div class="notice">

ここで登録した種目は、トレーニング記録の「種目」に自動的に追加されます。

</div>

<button onclick="showAddMenu()">＋ メニューを追加</button>

</div>

<div id="addMenuCard" class="card hidden">

<h2 id="menuFormTitle">メニューを追加</h2>

<label>部位</label>

<select id="menuCategory">

<option>胸</option>

<option>背中</option>

<option>肩</option>

<option>腕</option>

<option>脚</option>

<option>腹</option>

<option>有酸素</option>

<option>その他</option>

</select>

<label>メニュー名</label>

<input id="menuName" type="text" placeholder="例：インクラインベンチプレス">

<label>器具</label>

<select id="menuEquipment">

<option>マシン</option>

<option>バーベル</option>

<option>ダンベル</option>

<option>ケーブル</option>

<option>自重</option>

<option>その他</option>

</select>

<div class="row">

<button onclick="saveMenu()">保存</button>

<button class="secondary" onclick="cancelMenu()">キャンセル</button>

</div>

</div>

<div class="card">

<h2>登録メニュー</h2>

<div id="menuList"></div>

</div>

</section>

</main>

<!-- ================= BOTTOM NAV ================= -->

<nav class="bottomnav">

<button id="navCalendar" onclick="showScreen('calendar')" class="active">

📅<br>カレンダー

</button>

<button id="navRecord" onclick="openToday()">

🏋️<br>記録

</button>

<button id="navMenu" onclick="showScreen('menu')">

📋<br>メニュー

</button>

</nav>

<script>

/* =====================================================

   データ

===================================================== */

const defaultMenus = {

"胸":[

 {name:"ベンチプレス",equipment:"バーベル"},

 {name:"チェストプレス",equipment:"マシン"},

 {name:"ダンベルプレス",equipment:"ダンベル"},

 {name:"ディップス",equipment:"自重"}

],

"背中":[

 {name:"懸垂",equipment:"自重"},

 {name:"ラットプルダウン",equipment:"マシン"},

 {name:"ローイング",equipment:"マシン"},

 {name:"ワンハンドロー",equipment:"ダンベル"}

],

"肩":[

 {name:"ショルダープレス",equipment:"マシン"},

 {name:"サイドレイズ",equipment:"ダンベル"},

 {name:"フロントレイズ",equipment:"ダンベル"}

],

"腕":[

 {name:"アームカール",equipment:"ダンベル"},

 {name:"ハンマーカール",equipment:"ダンベル"},

 {name:"トライセプスプレスダウン",equipment:"ケーブル"}

],

"脚":[

 {name:"スクワット",equipment:"バーベル"},

 {name:"スミスマシンスクワット",equipment:"マシン"},

 {name:"レッグプレス",equipment:"マシン"},

 {name:"レッグカール",equipment:"マシン"},

 {name:"カーフレイズ",equipment:"マシン"}

],

"腹":[

 {name:"アブドミナル",equipment:"マシン"},

 {name:"レッグレイズ",equipment:"自重"},

 {name:"ケーブルクランチ",equipment:"ケーブル"}

],

"有酸素":[

 {name:"ランニング",equipment:"その他"},

 {name:"ジョギング",equipment:"その他"},

 {name:"ウォーキング",equipment:"その他"},

 {name:"サイクリング",equipment:"その他"},

 {name:"水泳",equipment:"その他"}

],

"その他":[

 {name:"その他",equipment:"その他"}

]

};

let data =

JSON.parse(localStorage.getItem("kintoreData") || "{}");

let menus =

JSON.parse(localStorage.getItem("kintoreMenus") || "null");

if(!menus){

menus = JSON.parse(JSON.stringify(defaultMenus));

localStorage.setItem(

 "kintoreMenus",

 JSON.stringify(menus)

);

}

let selectedDate = new Date();

let editingMenuCategory = null;

let editingMenuIndex = null;

/* =====================================================

   共通

===================================================== */

function dateKey(d){

return d.getFullYear()+"-"+

String(d.getMonth()+1).padStart(2,"0")+"-"+

String(d.getDate()).padStart(2,"0");

}

/* =====================================================

   画面切り替え

===================================================== */

function showScreen(screen){

document.getElementById("calendarScreen").classList.add("hidden");

document.getElementById("recordScreen").classList.add("hidden");

document.getElementById("menuScreen").classList.add("hidden");

document.getElementById("navCalendar").classList.remove("active");

document.getElementById("navRecord").classList.remove("active");

document.getElementById("navMenu").classList.remove("active");

if(screen==="calendar"){

document.getElementById("calendarScreen").classList.remove("hidden");

document.getElementById("navCalendar").classList.add("active");

drawCalendar();

}

if(screen==="record"){

document.getElementById("recordScreen").classList.remove("hidden");

document.getElementById("navRecord").classList.add("active");

}

if(screen==="menu"){

document.getElementById("menuScreen").classList.remove("hidden");

document.getElementById("navMenu").classList.add("active");

renderMenuList();

}

}

/* =====================================================

   カレンダー

===================================================== */

function changeMonth(amount){

selectedDate.setMonth(

 selectedDate.getMonth()+amount

);

drawCalendar();

}

function drawCalendar(){

let y=selectedDate.getFullYear();

let m=selectedDate.getMonth();

document.getElementById("monthTitle").textContent =

y+"年 "+(m+1)+"月";

let cal=document.getElementById("calendar");

cal.innerHTML="";

["日","月","火","水","木","金","土"].forEach(x=>{

let e=document.createElement("div");

e.textContent=x;

e.className="weekday";

cal.appendChild(e);

});

let first=new Date(y,m,1).getDay();

let days=new Date(y,m+1,0).getDate();

for(let i=0;i<first;i++){

cal.appendChild(

 document.createElement("div")

);

}

for(let d=1;d<=days;d++){

let date=new Date(y,m,d);

let key=dateKey(date);

let e=document.createElement("div");

e.className="day";

if(key===dateKey(new Date())){

e.classList.add("today");

}

let icon="";

if(data[key] && data[key].length){

icon="🔥";

}

e.innerHTML =

d+

"<div class='done'>"+

icon+

"</div>";

e.onclick=()=>openRecord(date);

cal.appendChild(e);

}

}

/* =====================================================

   記録

===================================================== */

function openToday(){

openRecord(new Date());

}

function openRecord(date){

selectedDate=date;

showScreen("record");

document.getElementById("recordDate").textContent =

date.getFullYear()+"年"+

(date.getMonth()+1)+"月"+

date.getDate()+"日の記録";

updateExercise();

showRecords();

}

function updateExercise(){

let cat=document.getElementById("category").value;

let ex=document.getElementById("exercise");

ex.innerHTML="";

(menus[cat] || []).forEach(item=>{

let option=document.createElement("option");

option.textContent=item.name;

ex.appendChild(option);

});

let cardio=cat==="有酸素";

document

.getElementById("strengthArea")

.classList.toggle("hidden",cardio);

document

.getElementById("cardioArea")

.classList.toggle("hidden",!cardio);

}

function saveRecord(){

let key=dateKey(selectedDate);

if(!data[key]){

data[key]=[];

}

let cat=document.getElementById("category").value;

let rec={

category:cat,

exercise:document.getElementById("exercise").value,

weight:document.getElementById("weight").value,

reps:document.getElementById("reps").value,

sets:document.getElementById("sets").value,

distance:document.getElementById("distance").value,

time:document.getElementById("time").value,

memo:document.getElementById("memo").value

};

data[key].push(rec);

localStorage.setItem(

"kintoreData",

JSON.stringify(data)

);

document.getElementById("memo").value="";

showRecords();

drawCalendar();

alert("保存しました！💪");

}

function showRecords(){

let key=dateKey(selectedDate);

let box=document.getElementById("records");

box.innerHTML="";

if(!data[key] || !data[key].length){

box.innerHTML="<div class='empty'>まだ記録はありません</div>";

return;

}

data[key].forEach((r,i)=>{

let e=document.createElement("div");

e.className="item";

if(r.category==="有酸素"){

e.innerHTML =

"🏃 "+

r.exercise+

"　"+

(r.distance||"-")+

"km / "+

(r.time||"-")+

"分"+

(r.memo?

"<br>📝 "+r.memo:""

);

}else{

e.innerHTML =

"🏋️ "+

r.exercise+

"　"+

(r.weight||"-")+

"kg × "+

(r.reps||"-")+

"回 × "+

(r.sets||"-")+

"set"+

(r.memo?

"<br>📝 "+r.memo:""

);

}

box.appendChild(e);

});

}

/* =====================================================

   メニュー管理

===================================================== */

function showAddMenu(){

editingMenuCategory=null;

editingMenuIndex=null;

document.getElementById("menuFormTitle").textContent =

"メニューを追加";

document.getElementById("menuName").value="";

document.getElementById("menuCategory").value="胸";

document.getElementById("menuEquipment").value="マシン";

document

.getElementById("addMenuCard")

.classList.remove("hidden");

}

function cancelMenu(){

document

.getElementById("addMenuCard")

.classList.add("hidden");

editingMenuCategory=null;

editingMenuIndex=null;

}

function saveMenu(){

let category =

document.getElementById("menuCategory").value;

let name =

document.getElementById("menuName").value.trim();

let equipment =

document.getElementById("menuEquipment").value;

if(!name){

alert("メニュー名を入力してください");

return;

}

if(!menus[category]){

menus[category]=[];

}

if(editingMenuCategory!==null){

menus[editingMenuCategory]

[editingMenuIndex]={

name:name,

equipment:equipment

};

}else{

menus[category].push({

name:name,

equipment:equipment

});

}

localStorage.setItem(

"kintoreMenus",

JSON.stringify(menus)

);

cancelMenu();

renderMenuList();

updateExercise();

alert("メニューを保存しました！");

}

function editMenu(category,index){

let menu=menus[category][index];

editingMenuCategory=category;

editingMenuIndex=index;

document.getElementById("menuFormTitle").textContent =

"メニューを編集";

document.getElementById("menuCategory").value =

category;

document.getElementById("menuName").value =

menu.name;

document.getElementById("menuEquipment").value =

menu.equipment;

document

.getElementById("addMenuCard")

.classList.remove("hidden");

}

function deleteMenu(category,index){

let menu=menus[category][index];

if(!confirm(

"「"+menu.name+"」を削除しますか？"

)){

return;

}

menus[category].splice(index,1);

localStorage.setItem(

"kintoreMenus",

JSON.stringify(menus)

);

renderMenuList();

updateExercise();

}

function renderMenuList(){

let box=document.getElementById("menuList");

box.innerHTML="";

Object.keys(menus).forEach(category=>{

let title=document.createElement("h3");

title.className="category-title";

title.textContent=category;

box.appendChild(title);

if(!menus[category].length){

let empty=document.createElement("div");

empty.className="empty";

empty.textContent="登録なし";

box.appendChild(empty);

return;

}

menus[category].forEach((menu,index)=>{

let row=document.createElement("div");

row.className="menu-item";

let info=document.createElement("div");

info.className="menu-info";

info.innerHTML =

"<div class='menu-name'>"+

menu.name+

"</div>"+

"<div class='menu-equipment'>"+

menu.equipment+

"</div>";

let actions=document.createElement("div");

actions.className="actions";

let edit=document.createElement("button");

edit.className="small secondary";

edit.textContent="編集";

edit.onclick=()=>editMenu(category,index);

let del=document.createElement("button");

del.className="small danger";

del.textContent="削除";

del.onclick=()=>deleteMenu(category,index);

actions.appendChild(edit);

actions.appendChild(del);

row.appendChild(info);

row.appendChild(actions);

box.appendChild(row);

});

});

}

/* =====================================================

   初期化

===================================================== */

drawCalendar();

updateExercise();

</script>

</body>

</html>

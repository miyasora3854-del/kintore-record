<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111827">

<title>筋トレ記録</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;

 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;

 background:#f4f5f7;color:#111827

}

button,input,select,textarea{font:inherit}

button{cursor:pointer;border:0}

.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}

header{

 background:#111827;color:white;padding:18px 18px 14px;

 position:sticky;top:0;z-index:5

}

.title{font-size:21px;font-weight:800}

.sub{font-size:12px;opacity:.7;margin-top:3px}

main{padding:14px}

.card{

 background:white;border-radius:16px;padding:16px;margin-bottom:12px;

 box-shadow:0 2px 10px #0000000b

}

h2{font-size:18px;margin:0 0 12px}

h3{font-size:15px;margin:0 0 10px}

.row{display:flex;gap:8px;align-items:center}

.between{justify-content:space-between}

.wrap{flex-wrap:wrap}

.btn{

 padding:10px 14px;border-radius:11px;background:#111827;

 color:white;font-weight:700

}

.btn.secondary{background:#e5e7eb;color:#111827}

.btn.danger{background:#fee2e2;color:#991b1b}

.btn.small{padding:7px 10px;font-size:13px}

input,select,textarea{

 width:100%;padding:10px 11px;border:1px solid #d1d5db;

 border-radius:10px;background:white

}

textarea{min-height:80px;resize:vertical}

label{

 display:block;font-size:12px;color:#6b7280;margin:9px 0 5px

}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tabs{

 position:fixed;bottom:0;left:0;right:0;background:#fff;

 border-top:1px solid #ddd;z-index:10;

 display:flex;justify-content:center

}

.tabs button{

 flex:1;max-width:190px;background:white;padding:10px 4px 12px;

 color:#6b7280;font-size:12px

}

.tabs button.active{color:#111827;font-weight:800}

.tabs b{display:block;font-size:20px}

.calendar-head{

 display:flex;align-items:center;justify-content:space-between;

 margin-bottom:10px

}

.month{font-weight:800;font-size:18px}

.week,.calendar{

 display:grid;grid-template-columns:repeat(7,1fr);gap:4px

}

.week div{

 text-align:center;font-size:11px;color:#6b7280;padding:4px

}

.day{

 min-height:72px;background:#fafafa;border:1px solid #eee;

 border-radius:10px;padding:5px;position:relative

}

.day button{

 width:100%;height:100%;background:transparent;

 text-align:left;padding:0

}

.day.muted{opacity:.35}

.day.today{outline:2px solid #111827}

.day.selected{background:#eef2ff}

.day .num{font-weight:700;font-size:12px}

.legend{font-size:11px;color:#6b7280;line-height:1.7}

.home-wrap{

 height:calc(100vh - 132px);

 display:flex;flex-direction:column;overflow:hidden

}

.home-calendar{

 flex:0 0 auto;background:#f4f5f7;padding-bottom:8px

}

.home-details{

 flex:1;overflow-y:auto;padding-top:4px

}

.home-details .card:last-child{margin-bottom:20px}

.canvas-wrap{width:100%;height:280px}

.canvas-wrap canvas{width:100%;height:100%}

.set{

 display:grid;grid-template-columns:45px 1fr 1fr 42px;

 gap:7px;align-items:center;margin-bottom:7px

}

.setno{font-weight:800;color:#6b7280;text-align:center}

.set input{min-width:0}

.exercise-card{

 border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin:10px 0

}

.pill{

 display:inline-block;background:#eef2ff;border-radius:999px;

 padding:4px 8px;font-size:11px;margin:2px

}

.hidden{display:none!important}

.empty{text-align:center;color:#6b7280;padding:25px 5px}

.notice{

 background:#fff7ed;border:1px solid #fed7aa;

 border-radius:12px;padding:11px;font-size:13px

}

.statgrid{

 display:grid;grid-template-columns:repeat(2,1fr);gap:9px

}

.stat{

 background:#f9fafb;border-radius:12px;padding:12px

}

.stat strong{font-size:20px;display:block}

.muted{color:#6b7280;font-size:12px}

hr{border:0;border-top:1px solid #eee;margin:14px 0}

.modal{

 position:fixed;inset:0;background:#0008;

 display:flex;align-items:center;justify-content:center;

 padding:18px;z-index:50

}

.modal-box{

 background:white;width:min(560px,100%);

 max-height:90vh;overflow:auto;border-radius:18px;

 padding:18px;box-shadow:0 20px 60px #0005

}

.modal-head{

 display:flex;justify-content:space-between;

 align-items:center;margin-bottom:8px

}

.modal-close{

 background:#f3f4f6;border-radius:50%;

 width:36px;height:36px;font-size:22px

}

</style>

</head>

<body>

<div class="app">

<header>

 <div class="title">🏋️ 筋トレ記録</div>

 <div class="sub" id="headerSub">自分のトレーニングを記録</div>

</header>

<main id="main"></main>

<div id="modalRoot"></div>

<nav class="tabs">

<button data-tab="calendar" onclick="showTab('calendar')">

 <b>🏠</b>ホーム

</button>

<button data-tab="menu" onclick="showTab('menu')">

 <b>📋</b>種目管理

</button>

<button data-tab="analysis" onclick="showTab('analysis')">

 <b>📊</b>分析

</button>

<button data-tab="settings" onclick="showTab('settings')">

 <b>⚙️</b>メニュー

</button>

</nav>

</div>

<script>

const KEY='kintoreData';

const MENUKEY='kintoreMenus';

const PLANKEY='kintorePlans';

const PROFILEKEY='kintoreProfile';

const cats=[

 '胸','背中','肩','腕','脚','腹','有酸素','その他'

];

const cardio=[

 'ランニング','ジョギング','ウォーキング',

 'サイクリング','水泳','その他'

];

const defaults=[

 ['胸','ベンチプレス','バーベル'],

 ['胸','チェストプレス','マシン'],

 ['胸','ダンベルプレス','ダンベル'],

 ['胸','ディップス','自重'],

 ['背中','懸垂','自重'],

 ['背中','ラットプルダウン','マシン'],

 ['背中','ローイング','マシン'],

 ['背中','ワンハンドロー','ダンベル'],

 ['肩','ショルダープレス','マシン'],

 ['肩','サイドレイズ','ダンベル'],

 ['肩','フロントレイズ','ダンベル'],

 ['腕','アームカール','マシン'],

 ['腕','ハンマーカール','ダンベル'],

 ['腕','トライセプスプレスダウン','ケーブル'],

 ['脚','スクワット','バーベル'],

 ['脚','スミスマシンスクワット','スミス'],

 ['脚','レッグプレス','マシン'],

 ['脚','レッグカール','マシン'],

 ['脚','カーフレイズ','スミス'],

 ['腹','アブドミナル','マシン'],

 ['腹','レッグレイズ','自重'],

 ['腹','ケーブルクランチ','ケーブル'],

 ...cardio.map(x=>['有酸素',x,'有酸素']),

 ['その他','その他','その他']

];

function loadJSON(key,fallback){

 try{

  const v=localStorage.getItem(key);

  return v ? JSON.parse(v) : fallback;

 }catch(e){

  console.warn('保存データ読み込みエラー',e);

  return fallback;

 }

}

let data=loadJSON(KEY,{});

let menus=loadJSON(MENUKEY,null);

if(!Array.isArray(menus)){

 menus=[];

}

function mergeDefaultMenus(){

 const key=new Set(

  menus.map(m=>m.cat+'|'+m.name)

 );

 defaults.forEach((x,i)=>{

  const k=x[0]+'|'+x[1];

  if(!key.has(k)){

   menus.push({

    id:'mdefault'+i,

    cat:x[0],

    name:x[1],

    equip:x[2]

   });

  }

 });

}

mergeDefaultMenus();

let plans=loadJSON(PLANKEY,{});

let profile=loadJSON(PROFILEKEY,null);

if(!profile){

 profile={

  name:'自分',

  height:'',

  weight:''

 };

}

let templates=loadJSON(

 'kintoreTemplates',

 {}

);

if(!templates || typeof templates!=='object'){

 templates={};

}

let state={

 tab:'calendar',

 date:isoToday(),

 month:new Date(),

 editing:null,

 analysisExercise:''

};

function saveAll(){

 try{

  localStorage.setItem(

   KEY,

   JSON.stringify(data)

  );

  localStorage.setItem(

   MENUKEY,

   JSON.stringify(menus)

  );

  localStorage.setItem(

   PLANKEY,

   JSON.stringify(plans)

  );

  localStorage.setItem(

   PROFILEKEY,

   JSON.stringify(profile)

  );

  localStorage.setItem(

   'kintoreTemplates',

   JSON.stringify(templates)

  );

 }catch(e){

  alert('保存に失敗しました。端末の保存容量を確認してください。');

 }

}

function isoToday(){

 const d=new Date();

 return localDate(d);

}

function localDate(d){

 return d.getFullYear()+

 '-' +

 String(d.getMonth()+1).padStart(2,'0')+

 '-' +

 String(d.getDate()).padStart(2,'0');

}

function esc(s){

 return String(s??'').replace(

  /[&<>"']/g,

  m=>({

   '&':'&amp;',

   '<':'&lt;',

   '>':'&gt;',

   '"':'&quot;',

   "'":'&#39;'

  }[m])

 );

}

function showTab(t){

 state.tab=t;

 state.editing=null;

 render();

}

function render(){

 document.querySelectorAll('.tabs button')

 .forEach(b=>{

  b.classList.toggle(

   'active',

   b.dataset.tab===state.tab

  );

 });

 document.getElementById(

  'headerSub'

 ).textContent=

 profile.name+' のトレーニング記録';

 if(state.tab==='calendar'){

  renderCalendar();

 }

 else if(state.tab==='menu'){

  renderMenu();

 }

 else if(state.tab==='analysis'){

  renderAnalysis();

 }

 else{

  renderSettings();

 }

}

function renderCalendar(){

 const d=state.month;

 const y=d.getFullYear();

 const m=d.getMonth();

 const first=new Date(y,m,1);

 const last=new Date(y,m+1,0);

 const start=(first.getDay()+6)%7;

 let cells=[];

 for(let i=0;i<start;i++){

  cells.push(

   '<div class="day muted"></div>'

  );

 }

 for(let n=1;n<=last.getDate();n++){

  const date=localDate(

   new Date(y,m,n)

  );

  cells.push(`

   <div class="day

    ${date===isoToday()?'today':''}

    ${date===state.date?'selected':''}">

    <button onclick="openDate('${date}')">

     <div class="num">${n}</div>

    </button>

   </div>

  `);

 }

 const totals=monthTotals(y,m);

 document.getElementById('main').innerHTML=`

 <div class="home-wrap">

  <div class="home-calendar">

   <div class="calendar-head">

    <button

     class="btn secondary small"

     onclick="moveMonth(-1)">

     ‹

    </button>

    <div class="month">

     ${y}年${m+1}月

    </div>

    <button

     class="btn secondary small"

     onclick="moveMonth(1)">

     ›

    </button>

   </div>

   <div class="week">

    ${[

     '月','火','水','木','金','土','日'

    ].map(x=>`<div>${x}</div>`).join('')}

   </div>

   <div class="calendar">

    ${cells.join('')}

   </div>

   <div

    class="statgrid"

    style="margin-top:8px">

    <div class="stat">

     <span class="muted">

      今月セット数

     </span>

     <strong>

      ${totals.sets}

     </strong>

     <span class="muted">

      sets

     </span>

    </div>

    <div class="stat">

     <span class="muted">

      今月推定消費

     </span>

     <strong>

      ${Math.round(

       totals.calories

      ).toLocaleString()}

     </strong>

     <span class="muted">

      kcal

     </span>

    </div>

   </div>

  </div>

  <div

   class="home-details"

   id="homeDetails">

  </div>

 </div>

 `;

 renderHomeDetails();

}

function monthTotals(y,m){

 const prefix=

  y+'-'+

  String(m+1).padStart(2,'0');

 let sets=0;

 let calories=0;

 Object.entries(data).forEach(

  ([date,r])=>{

   if(!date.startsWith(prefix)){

    return;

   }

   const workouts=

    Array.isArray(r?.workouts)

     ? r.workouts

     : [];

   workouts.forEach(w=>{

    if(w.cat==='有酸素'){

     calories+=estimateCalories(w);

    }else{

     const arr=

      Array.isArray(w.sets)

       ? w.sets

       : [];

     sets+=arr.filter(

      s=>

       s.weight!=='' ||

       s.reps!==''

     ).length;

    }

   });

  }

 );

 return {

  sets,

  calories

 };

}

function estimateCalories(w){

 const weight=

  Number(profile.weight)||62;

 if(w.cat!=='有酸素'){

  return 0;

 }

 const minutes=

  Number(w.time)||0;

 const met={

  'ランニング':9.8,

  'ジョギング':7,

  'ウォーキング':3.5,

  'サイクリング':7.5,

  '水泳':8,

  'その他':5

 }[w.exercise]||5;

 return met*

  3.5*

  weight/

  200*

  minutes;

}

function openDate(date){

 state.date=date;

 state.tab='calendar';

 render();

 setTimeout(()=>{

  const el=

   document.getElementById(

    'homeDetails'

   );

  if(el){

   el.scrollTop=0;

  }

 },20);

}

function moveMonth(diff){

 state.month.setMonth(

  state.month.getMonth()+diff

 );

 render();

}

function renderHomeDetails(){

 const box=

  document.getElementById(

   'homeDetails'

  );

 if(!box)return;

 const r=

  data[state.date]||

  {

   workouts:[],

   memo:''

  };

 const plan=

  Array.isArray(plans[state.date])

   ? plans[state.date]

   : [];

 const workouts=

  Array.isArray(r.workouts)

   ? r.workouts

   : [];

 box.innerHTML=`

 <div class="card">

  <div class="row between">

   <h2 style="margin:0">

    ${state.date.replaceAll('-','/')}

   </h2>

   <button

    class="btn small"

    onclick="addWorkout()">

    ＋ 記録

   </button>

  </div>

  ${

   plan.length

   ?

   `<div

    class="notice"

    style="margin-top:10px">

    📅 予定：

    ${plan.map(esc).join(' / ')}

   </div>`

   :''

  }

  ${

   workouts.length

   ?

   workouts.map(

    (w,i)=>homeWorkoutHTML(w,i)

   ).join('')

   :

   '<div class="empty">この日の記録はありません</div>'

  }

  <label>

   全体メモ

  </label>

  <textarea

   id="dayMemo"

   placeholder="今日の体調・気づきなど"

  >${esc(r.memo||'')}</textarea>

  <button

   class="btn"

   style="margin-top:8px"

   onclick="saveDay()">

   保存

  </button>

  <button

   class="btn secondary"

   style="margin-left:6px"

   onclick="copyPrevious()">

   前回コピー

  </button>

 </div>

 `;

}

function homeWorkoutHTML(w,i){

 if(w.cat==='有酸素'){

  return `

  <div class="exercise-card">

   <div class="row between">

    <div>

     <strong>

      ${esc(w.exercise)}

     </strong>

     <span class="pill">

      有酸素

     </span>

    </div>

    <button

     class="btn danger small"

     onclick="removeWorkout(${i})">

     削除

    </button>

   </div>

   <label>

    時間（分）

   </label>

   <input

    class="cardio-time"

    data-i="${i}"

    type="number"

    min="0"

    value="${esc(w.time||'')}"

    placeholder="例：60">

   <div

    class="muted"

    style="margin-top:6px">

    推定消費：

    ${Math.round(

     estimateCalories(w)

    )} kcal

   </div>

   <label>

    種目メモ

   </label>

   <textarea

    class="workout-memo"

    data-i="${i}"

    placeholder="メモ"

   >${esc(w.memo||'')}</textarea>

  </div>

  `;

 }

 const sets=

  Array.isArray(w.sets)

   ? w.sets

   : [];

 return `

 <div class="exercise-card">

  <div class="row between">

   <div>

    <strong>

     ${esc(w.exercise)}

    </strong>

    <span class="pill">

     ${esc(w.cat)}

    </span>

    <span class="pill">

     ${esc(w.equip||'')}

    </span>

   </div>

   <button

    class="btn danger small"

    onclick="removeWorkout(${i})">

    削除

   </button>

  </div>

  <div

   style="margin-top:10px">

   ${sets.map(

    (s,j)=>`

    <div class="set">

     <div class="setno">

      ${j+1}

     </div>

     <input

      class="weight"

      data-i="${i}"

      data-j="${j}"

      type="number"

      step="0.1"

      value="${esc(s.weight??'')}"

      placeholder="重量 kg">

     <input

      class="reps"

      data-i="${i}"

      data-j="${j}"

      type="number"

      value="${esc(s.reps??'')}"

      placeholder="rep">

     <button

      class="btn danger small"

      onclick="removeSet(${i},${j})">

      ×

     </button>

    </div>

   `).join('')}

  </div>

  <button

   class="btn secondary small"

   onclick="addSet(${i})">

   ＋セット追加

  </button>

  <label>

   種目メモ

  </label>

  <textarea

   class="workout-memo"

   data-i="${i}"

   placeholder="この種目についてのメモ"

  >${esc(w.memo||'')}</textarea>

 </div>

 `;

}

function saveDay(){

 const old=

  data[state.date]||

  {

   workouts:[],

   memo:''

  };

 const workouts=

  Array.isArray(old.workouts)

   ? old.workouts

   : [];

 document.querySelectorAll(

  '.weight'

 ).forEach(el=>{

  const i=

   Number(el.dataset.i);

  const j=

   Number(el.dataset.j);

  if(workouts[i]&&workouts[i].sets[j]){

   workouts[i].sets[j].weight=

    el.value;

  }

 });

 document.querySelectorAll(

  '.reps'

 ).forEach(el=>{

  const i=

   Number(el.dataset.i);

  const j=

   Number(el.dataset.j);

  if(workouts[i]&&workouts[i].sets[j]){

   workouts[i].sets[j].reps=

    el.value;

  }

 });

 document.querySelectorAll(

  '.cardio-time'

 ).forEach(el=>{

  const i=

   Number(el.dataset.i);

  if(workouts[i]){

   workouts[i].time=

    el.value;

  }

 });

 document.querySelectorAll(

  '.workout-memo'

 ).forEach(el=>{

  const i=

   Number(el.dataset.i);

  if(workouts[i]){

   workouts[i].memo=

    el.value;

  }

 });

 old.workouts=workouts;

 const memo=

  document.getElementById(

   'dayMemo'

  );

 old.memo=

  memo ? memo.value : '';

 data[state.date]=old;

 saveAll();

 render();

}

function addSet(i){

 if(!data[state.date]){

  data[state.date]={

   workouts:[],

   memo:''

  };

 }

 if(!Array.isArray(

  data[state.date].workouts

 )){

  data[state.date].workouts=[];

 }

 const w=

  data[state.date].workouts[i];

 if(!w)return;

 if(!Array.isArray(w.sets)){

  w.sets=[];

 }

 w.sets.push({

  weight:'',

  reps:''

 });

 renderHomeDetails();

}

function removeSet(i,j){

 const w=

  data[state.date]?.workouts?.[i];

 if(!w)return;

 if(w.sets.length<=1){

  alert(

   'セットを0件にはできません。'

  );

  return;

 }

 w.sets.splice(j,1);

 saveAll();

 renderHomeDetails();

}

function removeWorkout(i){

 if(!data[state.date]?.workouts){

  return;

 }

 if(

  confirm(

   'この記録を削除しますか？'

  )

 ){

  data[state.date].workouts.splice(

   i,

   1

  );

  saveAll();

  renderHomeDetails();

 }

}

function addWorkout(){

 const menuOptions=

  menus.map(

   m=>`

   <option

    value="${esc(m.id)}">

    ${esc(m.cat)}

    ／

    ${esc(m.name)}

   </option>

  `

  ).join('');

 document.getElementById(

  'modalRoot'

 ).innerHTML=`

 <div

  class="modal"

  onclick="if(event.target===this)closeModal()">

  <div class="modal-box">

   <div class="modal-head">

    <h2 style="margin:0">

     記録を追加

    </h2>

    <button

     class="modal-close"

     onclick="closeModal()">

     ×

    </button>

   </div>

   <label>

    種目

   </label>

   <select id="addExercise">

    ${menuOptions}

   </select>

   <div

    class="notice"

    style="margin-top:12px">

    筋トレ種目は

    <strong>3セット</strong>

    が初期表示されます。

   </div>

   <div

    class="row"

    style="margin-top:14px;justify-content:flex-end">

    <button

     class="btn secondary"

     onclick="closeModal()">

     キャンセル

    </button>

    <button

     class="btn"

     onclick="confirmAddWorkout()">

     追加

    </button>

   </div>

  </div>

 </div>

 `;

}

function confirmAddWorkout(){

 const id=

  document.getElementById(

   'addExercise'

  ).value;

 const m=

  menus.find(

   x=>x.id===id

  );

 if(!m)return;

 if(!data[state.date]){

  data[state.date]={

   workouts:[],

   memo:''

  };

 }

 if(!Array.isArray(

function saveSchedule(){

  d.setDate(

   start.getDate()+k

  );

  const idx=

   (d.getDay()+6)%7;

   plans['wd'+idx];

   plans[localDate(d)]=

    templates[name].slice();

  }

  '今後4週間の予定を作成しました'

 );

function renderAnalysis(){

 const entries=

  Object.entries(data);

 const now=new Date();

 const y=

  now.getFullYear();

 const m=

  now.getMonth()+1;

 const prefix=

  y+'-'+

  String(m).padStart(2,'0');

 const current=

  entries.filter(

   ([d])=>d.startsWith(prefix)

  );

 const count=

  a=>

   a.filter(

    ([,v])=>

     Array.isArray(v?.workouts)&&

     v.workouts.length

   ).length;

 const setCount=

  a=>

   a.reduce(

    (n,[,v])=>

     n+

     (Array.isArray(v?.workouts)

      ?v.workouts.reduce(

       (z,w)=>

        z+

        (

         w.cat==='有酸素'

          ?0

          :(

           Array.isArray(w.sets)

            ?w.sets

            :[]

          ).filter(

           s=>

            s.weight!==''||

            s.reps!==''

          ).length

        ),

       0

      )

      :0),

    0

   );

 const volume=

  a=>

   a.reduce(

    (n,[,v])=>

     n+

     (

      Array.isArray(v?.workouts)

       ?v.workouts.reduce(

        (z,w)=>

         z+

         (

          Array.isArray(w.sets)

           ?w.sets

           :[]

         ).reduce(

          (q,s)=>

           q+

           (

            Number(s.weight)||0

           )*

           (

            Number(s.reps)||0

           ),

          0

         ),

        0

       )

       :0

     ),

    0

   );

 const calories=

  a=>

   a.reduce(

    (n,[,v])=>

     n+

     (

      Array.isArray(v?.workouts)

       ?v.workouts.reduce(

        (z,w)=>

         z+

         estimateCalories(w),

        0

       )

       :0

     ),

    0

   );

 let exercises=[

  ...new Set(

   entries.flatMap(

    ([,v])=>

     (

      Array.isArray(v?.workouts)

       ?v.workouts

       :[]

     )

     .filter(

      w=>w.cat!=='有酸素'

     )

     .map(

      w=>w.exercise

     )

   )

  )

 ];

 let selected=

  state.analysisExercise||

  exercises[0]||

  '';

 if(

  selected &&

  !exercises.includes(selected)

 ){

  selected=exercises[0]||'';

 }

 document.getElementById(

  'main'

 ).innerHTML=`

 <div class="card">

  <h2>

   ${y}年${m}月

  </h2>

  <div class="statgrid">

   <div class="stat">

    <span class="muted">

     トレーニング日

    </span>

    <strong>

     ${count(current)}

    </strong>

    日

   </div>

   <div class="stat">

    <span class="muted">

     セット数

    </span>

    <strong>

     ${setCount(current)}

    </strong>

   </div>

   <div class="stat">

    <span class="muted">

     総負荷

    </span>

    <strong>

     ${Math.round(

      volume(current)

     ).toLocaleString()}

    </strong>

    <span class="muted">

     kg

    </span>

   </div>

   <div class="stat">

    <span class="muted">

     推定消費

    </span>

    <strong>

     ${Math.round(

      calories(current)

     ).toLocaleString()}

    </strong>

    <span class="muted">

     kcal

    </span>

   </div>

  </div>

 </div>

 <div class="card">

  <h2>

   種目別・重量推移

  </h2>

  ${

   exercises.length

   ?

   `

   <select

    id="analysisExercise"

    onchange="

     state.analysisExercise=this.value;

     renderAnalysis()

    ">

    ${

     exercises.map(

      e=>`

      <option

       value="${esc(e)}"

       ${

        e===selected

         ?'selected'

         :''

       }>

       ${esc(e)}

      </option>

      `

     ).join('')

    }

   </select>

   <div class="canvas-wrap">

    <canvas

     id="weightChart">

    </canvas>

   </div>

   `

   :

   '<div class="empty">重量記録がありません</div>'

  }

 </div>

 <div class="card">

  <h2>

   MAX重量

  </h2>

  ${

   exercises.length

   ?

   exercises.map(

    e=>{

     let max=0;

     entries.forEach(

      ([,v])=>{

       (

        Array.isArray(v?.workouts)

         ?v.workouts

         :[]

       )

       .filter(

        w=>w.exercise===e

       )

       .forEach(

        w=>{

         (

          Array.isArray(w.sets)

           ?w.sets

           :[]

         )

         .forEach(

          s=>{

           max=Math.max(

            max,

            Number(s.weight)||0

           );

          }

         );

        }

       );

      }

     );

     return `

     <div

      class="row between"

      style="

       padding:8px 0;

       border-bottom:1px solid #eee

      ">

      <span>

       ${esc(e)}

      </span>

      <strong>

       ${max||'-'}

       ${max?'kg':''}

      </strong>

     </div>

     `;

    }

   ).join('')

   :

   '<div class="empty">まだありません</div>'

  }

 </div>

 <div class="card">

  <h3>

   消費カロリーについて

  </h3>

  <p class="muted">

   有酸素運動の時間と体重から

   METsを使って推定します。

   実測値ではないため、

   目安として表示します。

   <br><br>

   筋トレは時間記録がないため、

   現時点では合計に含めていません。

  </p>

 </div>

 `;

 if(exercises.length){

  drawWeightChart(selected);

 }

}

function drawWeightChart(exercise){

 const c=

  document.getElementById(

   'weightChart'

  );

 if(!c)return;

 const rect=

  c.getBoundingClientRect();

 const dpr=

  window.devicePixelRatio||1;

 const w=

  Math.max(

   300,

   rect.width

  );

 const h=

  Math.max(

   240,

   rect.height

  );

 c.width=w*dpr;

 c.height=h*dpr;

 const ctx=

  c.getContext('2d');

 ctx.scale(

  dpr,

  dpr

 );

 ctx.clearRect(

  0,

  0,

  w,

  h

 );

 let pts=[];

 Object.keys(data)

 .sort()

 .forEach(

  date=>{

   const workouts=

    Array.isArray(

     data[date]?.workouts

    )

    ?data[date].workouts

    :[];

   workouts

   .filter(

    x=>x.exercise===exercise

   )

   .forEach(

    x=>{

     const sets=

      Array.isArray(x.sets)

       ?x.sets

       :[];

     sets.forEach(

      s=>{

       const v=

        Number(s.weight);

       if(v>0){

        pts.push({

         date,

         v

        });

       }

      }

     );

    }

   );

  }

 );

 if(!pts.length){

  ctx.fillText(

   '重量データがありません',

   20,

   40

  );

  return;

 }

 const max=

  Math.max(

   ...pts.map(

    p=>p.v

   )

  );

 const min=

  Math.min(

   ...pts.map(

    p=>p.v

   )

  );

 const left=45;

 const right=12;

 const top=20;

 const bottom=38;

 const pad=

  (max-min)||1;

 ctx.font=

  '12px -apple-system,BlinkMacSystemFont,sans-serif';

 ctx.strokeStyle='#ddd';

 ctx.fillStyle='#666';

 for(let i=0;i<=4;i++){

  const yy=

   top+

   (h-top-bottom)*i/4;

  const val=

   max-

   pad*i/4;

  ctx.beginPath();

  ctx.moveTo(

   left,

   yy

  );

  ctx.lineTo(

   w-right,

   yy

  );

  ctx.stroke();

  ctx.fillText(

   Math.round(

    val*10

   )/10+'kg',

   2,

   yy+4

  );

 }

 ctx.strokeStyle='#111';

 ctx.beginPath();

 pts.forEach(

  (p,i)=>{

   const x=

    left+

    (w-left-right)*

    (

     pts.length===1

      ?0.5

      :i/(pts.length-1)

    );

   const y=

    top+

    (h-top-bottom)*

    (max-p.v)/pad;

   if(i){

    ctx.lineTo(

     x,

     y

    );

   }else{

    ctx.moveTo(

     x,

     y

    );

   }

  }

 );

 ctx.stroke();

 ctx.fillStyle='#111';

 pts.forEach(

  (p,i)=>{

   const x=

    left+

    (w-left-right)*

    (

     pts.length===1

      ?0.5

      :i/(pts.length-1)

    );

   const yy=

    top+

    (h-top-bottom)*

    (max-p.v)/pad;

   ctx.beginPath();

   ctx.arc(

    x,

    yy,

    3,

    0,

    Math.PI*2

   );

   ctx.fill();

  }

 );

 ctx.fillStyle='#666';

 ctx.fillText(

  pts[0].date.slice(5),

  left,

  h-12

 );

 if(pts.length>1){

  ctx.fillText(

   pts[pts.length-1].date.slice(5),

   w-50,

   h-12

  );

 }

}

render();

</script>

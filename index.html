<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>筋トレ記録</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;

  background:#f5f5f7;

  color:#222;

}

header{

  background:#111;

  color:white;

  padding:18px 16px;

  text-align:center;

  font-size:22px;

  font-weight:bold;

}

main{

  max-width:700px;

  margin:auto;

  padding:16px 16px 90px;

}

.card{

  background:white;

  border-radius:14px;

  padding:16px;

  margin-bottom:14px;

  box-shadow:0 2px 8px rgba(0,0,0,.06);

}

button{

  border:0;

  border-radius:10px;

  padding:11px 15px;

  font-size:15px;

  cursor:pointer;

}

.primary{

  background:#111;

  color:white;

}

.secondary{

  background:#eee;

}

.danger{

  background:#e74c3c;

  color:white;

}

input,select,textarea{

  width:100%;

  padding:10px;

  margin-top:6px;

  border:1px solid #ccc;

  border-radius:8px;

  font-size:16px;

}

label{

  display:block;

  margin-top:12px;

  font-weight:bold;

}

.hidden{display:none!important}

.tabs{

  position:fixed;

  bottom:0;

  left:0;

  right:0;

  background:white;

  border-top:1px solid #ddd;

  display:flex;

  justify-content:space-around;

  padding:8px 0;

  z-index:50;

}

.tabs button{

  background:white;

  padding:7px 10px;

  font-size:12px;

}

.calendar-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;

}

.calendar-title button{

  padding:7px 12px;

}

.calendar{

  display:grid;

  grid-template-columns:repeat(7,1fr);

  gap:5px;

}

.week{

  text-align:center;

  font-size:12px;

  color:#777;

  padding:5px 0;

}

.day{

  min-height:62px;

  background:#fafafa;

  border:1px solid #eee;

  border-radius:8px;

  padding:5px;

  font-size:13px;

  cursor:pointer;

}

.day.today{

  border:2px solid #111;

}

.day.selected{

  background:#eee;

}

.daynum{

  font-weight:bold;

}

.mark{

  font-size:16px;

  margin-top:5px;

}

.row{

  display:grid;

  grid-template-columns:45px 1fr 1fr;

  gap:7px;

  align-items:end;

  margin-top:8px;

}

.setno{

  font-weight:bold;

  padding-bottom:10px;

}

.small{

  font-size:12px;

  color:#777;

}

.exercise{

  border:1px solid #ddd;

  border-radius:10px;

  padding:12px;

  margin:8px 0;

  background:#fff;

}

.exercise-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.exercise-name{

  font-weight:bold;

}

.modal-bg{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.55);

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:100;

  padding:18px;

}

.modal{

  background:white;

  width:100%;

  max-width:500px;

  max-height:90vh;

  overflow:auto;

  border-radius:16px;

  padding:20px;

}

.modal-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.close{

  background:#eee;

  border-radius:50%;

  width:34px;

  height:34px;

  padding:0;

}

.actions{

  display:flex;

  gap:8px;

  margin-top:16px;

}

.actions button{

  flex:1;

}

.list-item{

  padding:12px 0;

  border-bottom:1px solid #eee;

}

.badge{

  display:inline-block;

  background:#eee;

  border-radius:20px;

  padding:4px 8px;

  font-size:12px;

  margin:2px;

}

</style>

</head>

<body>

<header>筋トレ記録</header>

<main>

<!-- カレンダー -->

<section id="calendarPage">

  <div class="card">

    <div class="calendar-title">

      <button class="secondary" onclick="changeMonth(-1)">‹</button>

      <h2 id="monthTitle"></h2>

      <button class="secondary" onclick="changeMonth(1)">›</button>

    </div>

    <div class="calendar">

      <div class="week">日</div>

      <div class="week">月</div>

      <div class="week">火</div>

      <div class="week">水</div>

      <div class="week">木</div>

      <div class="week">金</div>

      <div class="week">土</div>

    </div>

    <div id="calendar" class="calendar"></div>

  </div>

  <div class="card">

    <b>マーク</b><br>

    🔥 トレーニング<br>

    📅 予定<br>

    🏆 PR更新<br>

    📝 メモ

  </div>

</section>

<!-- 記録 -->

<section id="recordPage" class="hidden">

  <div class="card">

    <h2 id="recordDateTitle"></h2>

    <button class="primary" onclick="showAddWorkout()">

      ＋ トレーニングを追加

    </button>

    <button class="secondary" onclick="copyPrevious()">

      ↩ 前回コピー

    </button>

  </div>

  <div id="workoutList"></div>

  <div class="card">

    <label>全体メモ</label>

    <textarea id="dayMemo" rows="4" placeholder="今日の感想など"></textarea>

    <button class="primary" style="margin-top:10px" onclick="saveMemo()">

      メモ保存

    </button>

  </div>

</section>

<!-- メニュー -->

<section id="menuPage" class="hidden">

  <div class="card">

    <h2>メニュー管理</h2>

    <button class="primary" onclick="showMenuModal()">

      ＋ 種目を追加

    </button>

  </div>

  <div id="menuList"></div>

  <div class="card">

    <h2>保存メニュー</h2>

    <button class="primary" onclick="showTemplateModal()">

      ＋ 保存メニューを作成

    </button>

    <div id="templateList"></div>

  </div>

</section>

<!-- 分析 -->

<section id="analysisPage" class="hidden">

  <div class="card">

    <h2>分析</h2>

    <div id="analysis"></div>

  </div>

</section>

</main>

<!-- 下部メニュー -->

<nav class="tabs">

  <button onclick="showPage('calendar')">📅<br>カレンダー</button>

  <button onclick="showPage('record')">🏋️<br>記録</button>

  <button onclick="showPage('menu')">📋<br>メニュー</button>

  <button onclick="showPage('analysis')">📊<br>分析</button>

</nav>

<!-- トレーニング追加モーダル -->

<div id="workoutModal" class="modal-bg hidden">

  <div class="modal">

    <div class="modal-head">

      <h2>トレーニング追加</h2>

      <button class="close" onclick="closeModal('workoutModal')">×</button>

    </div>

    <label>部位</label>

    <select id="bodyPart" onchange="updateExerciseSelect()">

      <option value="胸">胸</option>

      <option value="背中">背中</option>

      <option value="肩">肩</option>

      <option value="腕">腕</option>

      <option value="脚">脚</option>

      <option value="腹">腹</option>

      <option value="有酸素">有酸素</option>

      <option value="その他">その他</option>

    </select>

    <label>種目</label>

    <select id="exerciseSelect"></select>

    <div id="strengthInputs">

      <div id="setRows"></div>

      <button class="secondary" onclick="addSet()">

        ＋ セット追加

      </button>

      <label>メモ</label>

      <textarea id="exerciseMemo" rows="3"></textarea>

    </div>

    <div id="cardioInputs" class="hidden">

      <label>距離 km</label>

      <input id="distance" type="number" step="0.01">

      <label>時間</label>

      <input id="time" type="text" placeholder="60:00">

      <label>消費カロリー kcal（任意）</label>

      <input id="calories" type="number">

      <label>メモ</label>

      <textarea id="cardioMemo" rows="3"></textarea>

    </div>

    <div class="actions">

      <button class="secondary" onclick="closeModal('workoutModal')">

        キャンセル

      </button>

      <button class="primary" onclick="saveWorkout()">

        保存

      </button>

    </div>

  </div>

</div>

<!-- 種目管理モーダル -->

<div id="menuModal" class="modal-bg hidden">

  <div class="modal">

    <div class="modal-head">

      <h2 id="menuModalTitle">種目追加</h2>

      <button class="close" onclick="closeModal('menuModal')">×</button>

    </div>

    <input type="hidden" id="editMenuIndex">

    <label>部位</label>

    <select id="menuBodyPart">

      <option>胸</option>

      <option>背中</option>

      <option>肩</option>

      <option>腕</option>

      <option>脚</option>

      <option>腹</option>

      <option>有酸素</option>

      <option>その他</option>

    </select>

    <label>種目名</label>

    <input id="menuName" placeholder="例：ベンチプレス">

    <label>器具</label>

    <select id="menuEquipment">

      <option>マシン</option>

      <option>バーベル</option>

      <option>ダンベル</option>

      <option>ケーブル</option>

      <option>自重</option>

      <option>その他</option>

    </select>

    <div class="actions">

      <button class="secondary" onclick="closeModal('menuModal')">

        キャンセル

      </button>

      <button class="primary" onclick="saveMenu()">

        保存

      </button>

    </div>

  </div>

</div>

<!-- 保存メニューモーダル -->

<div id="templateModal" class="modal-bg hidden">

  <div class="modal">

    <div class="modal-head">

      <h2>保存メニュー</h2>

      <button class="close" onclick="closeModal('templateModal')">×</button>

    </div>

    <label>メニュー名</label>

    <input id="templateName" placeholder="例：胸の日">

    <label>種目</label>

    <div id="templateExercises"></div>

    <div class="actions">

      <button class="secondary" onclick="closeModal('templateModal')">

        キャンセル

      </button>

      <button class="primary" onclick="saveTemplate()">

        保存

      </button>

    </div>

  </div>

</div>

<script>

const defaultMenus = {

  "胸":[

    ["ベンチプレス","バーベル"],

    ["チェストプレス","マシン"],

    ["ダンベルプレス","ダンベル"],

    ["ディップス","自重"]

  ],

  "背中":[

    ["懸垂","自重"],

    ["ラットプルダウン","マシン"],

    ["ローイング","マシン"],

    ["ワンハンドロー","ダンベル"]

  ],

  "肩":[

    ["ショルダープレス","マシン"],

    ["サイドレイズ","ダンベル"],

    ["フロントレイズ","ダンベル"]

  ],

  "腕":[

    ["アームカール","マシン"],

    ["ハンマーカール","ダンベル"],

    ["トライセプスプレスダウン","ケーブル"]

  ],

  "脚":[

    ["スクワット","バーベル"],

    ["スミスマシンスクワット","マシン"],

    ["レッグプレス","マシン"],

    ["レッグカール","マシン"],

    ["カーフレイズ","マシン"]

  ],

  "腹":[

    ["アブドミナル","マシン"],

    ["レッグレイズ","自重"],

    ["ケーブルクランチ","ケーブル"]

  ],

  "有酸素":[

    ["ランニング","その他"],

    ["ジョギング","その他"],

    ["ウォーキング","その他"],

    ["サイクリング","その他"],

    ["水泳","その他"]

  ],

  "その他":[

    ["その他","その他"]

  ]

};

let menus = loadJSON("kintoreMenus",defaultMenus);

let records = loadJSON("kintoreData",{});

let templates = loadJSON("kintoreTemplates",[]);

let selectedDate = todayString();

let currentMonth = new Date();

currentMonth.setDate(1);

let editingWorkoutIndex = null;

function loadJSON(key,fallback){

  try{

    const raw=localStorage.getItem(key);

    if(!raw) return structuredClone(fallback);

    const data=JSON.parse(raw);

    return data ?? structuredClone(fallback);

  }catch(e){

    console.log("データ読み込みエラー",key,e);

    return structuredClone(fallback);

  }

}

function saveJSON(key,data){

  try{

    localStorage.setItem(key,JSON.stringify(data));

  }catch(e){

    alert("データ保存に失敗しました");

  }

}

function todayString(){

  const d=new Date();

  return d.getFullYear()+"-"+

    String(d.getMonth()+1).padStart(2,"0")+"-"+

    String(d.getDate()).padStart(2,"0");

}

function dateString(y,m,d){

  return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");

}

function showPage(page){

  document.getElementById("calendarPage").classList.add("hidden");

  document.getElementById("recordPage").classList.add("hidden");

  document.getElementById("menuPage").classList.add("hidden");

  document.getElementById("analysisPage").classList.add("hidden");

  if(page==="calendar"){

    document.getElementById("calendarPage").classList.remove("hidden");

    renderCalendar();

  }

  if(page==="record"){

    document.getElementById("recordPage").classList.remove("hidden");

    renderRecord();

  }

  if(page==="menu"){

    document.getElementById("menuPage").classList.remove("hidden");

    renderMenus();

    renderTemplates();

  }

  if(page==="analysis"){

    document.getElementById("analysisPage").classList.remove("hidden");

    renderAnalysis();

  }

}

function renderCalendar(){

  const y=currentMonth.getFullYear();

  const m=currentMonth.getMonth();

  document.getElementById("monthTitle").textContent=

    y+"年"+(m+1)+"月";

  const cal=document.getElementById("calendar");

  cal.innerHTML="";

  const first=new Date(y,m,1).getDay();

  const last=new Date(y,m+1,0).getDate();

  for(let i=0;i<first;i++){

    const blank=document.createElement("div");

    cal.appendChild(blank);

  }

  for(let d=1;d<=last;d++){

    const date=dateString(y,m,d);

    const el=document.createElement("div");

    el.className="day";

    if(date===todayString())

      el.classList.add("today");

    if(date===selectedDate)

      el.classList.add("selected");

    let html=`<div class="daynum">${d}</div>`;

    if(records[date] && records[date].length){

      html+=`<div class="mark">🔥</div>`;

      if(hasPR(date))

        html+=`<div class="mark">🏆</div>`;

    }

    if(records[date] && records[date].memo)

      html+=`<div class="mark">📝</div>`;

    el.innerHTML=html;

    el.onclick=()=>{

      selectedDate=date;

      showPage("record");

    };

    cal.appendChild(el);

  }

}

function changeMonth(diff){

  currentMonth.setMonth(currentMonth.getMonth()+diff);

  renderCalendar();

}

function renderRecord(){

  document.getElementById("recordDateTitle").textContent=

    selectedDate.replaceAll("-","/");

  const list=document.getElementById("workoutList");

  list.innerHTML="";

  const day=records[selectedDate];

  document.getElementById("dayMemo").value=

    (day && day.memo) || "";

  if(!day || !Array.isArray(day.workouts) && !Array.isArray(day)){

    list.innerHTML=`

      <div class="card">

        まだ記録がありません。

      </div>`;

    return;

  }

  const workouts=Array.isArray(day)

    ? day

    : day.workouts;

  if(!workouts.length){

    list.innerHTML=`

      <div class="card">

        まだ記録がありません。

      </div>`;

    return;

  }

  workouts.forEach((w,index)=>{

    const card=document.createElement("div");

    card.className="card";

    if(w.type==="cardio"){

      card.innerHTML=`

        <div class="exercise-head">

          <div>

            <div class="exercise-name">

              ${escapeHTML(w.name)}

            </div>

            <span class="badge">有酸素</span>

          </div>

          <button class="danger"

            onclick="deleteWorkout(${index})">

            削除

          </button>

        </div>

        <p>

          距離：${w.distance || "-"} km<br>

          時間：${w.time || "-"}<br>

          ${w.calories ? "カロリー："+w.calories+" kcal<br>":""}

        </p>

        ${w.memo ? "<p>"+escapeHTML(w.memo)+"</p>":""}

      `;

    }else{

      const sets=normalizeSets(w.sets);

      let setText="";

      sets.forEach((s,i)=>{

        setText+=`

          <div>

            ${i+1}セット目：

            ${s.weight || "-"} kg ×

            ${s.reps || "-"}回

          </div>`;

      });

      card.innerHTML=`

        <div class="exercise-head">

          <div>

            <div class="exercise-name">

              ${escapeHTML(w.name)}

            </div>

            <span class="badge">

              ${escapeHTML(w.bodyPart || "")}

            </span>

            ${w.equipment ?

              `<span class="badge">${escapeHTML(w.equipment)}</span>`

              :""

            }

          </div>

          <button class="danger"

            onclick="deleteWorkout(${index})">

            削除

          </button>

        </div>

        <div style="margin-top:10px">

          ${setText}

        </div>

        ${w.memo ?

          `<p>${escapeHTML(w.memo)}</p>`:""

        }

      `;

    }

    list.appendChild(card);

  });

}

function normalizeSets(sets){

  if(Array.isArray(sets)){

    return sets.map(s=>({

      weight:s?.weight ?? "",

      reps:s?.reps ?? ""

    }));

  }

  if(typeof sets==="number" || typeof sets==="string"){

    return [

      {weight:sets,reps:""},

      {weight:"",reps:""},

      {weight:"",reps:""}

    ];

  }

  return [

    {weight:"",reps:""},

    {weight:"",reps:""},

    {weight:"",reps:""}

  ];

}

function showAddWorkout(){

  editingWorkoutIndex=null;

  document.getElementById("bodyPart").value="胸";

  updateExerciseSelect();

  document.getElementById("exerciseMemo").value="";

  document.getElementById("distance").value="";

  document.getElementById("time").value="";

  document.getElementById("calories").value="";

  document.getElementById("cardioMemo").value="";

  createSetRows(3);

  document.getElementById("workoutModal").classList.remove("hidden");

}

function updateExerciseSelect(){

  const part=document.getElementById("bodyPart").value;

  const select=document.getElementById("exerciseSelect");

  select.innerHTML="";

  const list=menus[part] || [];

  list.forEach(item=>{

    const option=document.createElement("option");

    option.value=item[0];

    option.textContent=item[0];

    option.dataset.equipment=item[1] || "";

    select.appendChild(option);

  });

  const isCardio=part==="有酸素";

  document.getElementById("strengthInputs")

    .classList.toggle("hidden",isCardio);

  document.getElementById("cardioInputs")

    .classList.toggle("hidden",!isCardio);

}

function createSetRows(count){

  const box=document.getElementById("setRows");

  box.innerHTML="";

  for(let i=0;i<count;i++){

    const row=document.createElement("div");

    row.className="row";

    row.innerHTML=`

      <div class="setno">${i+1}</div>

      <div>

        <div class="small">重量 kg</div>

        <input class="weight" type="number" step="0.1">

      </div>

      <div>

        <div class="small">回数</div>

        <input class="reps" type="number">

      </div>

    `;

    box.appendChild(row);

  }

}

function addSet(){

  const rows=document.querySelectorAll("#setRows .row");

  const row=document.createElement("div");

  row.className="row";

  row.innerHTML=`

    <div class="setno">${rows.length+1}</div>

    <div>

      <div class="small">重量 kg</div>

      <input class="weight" type="number" step="0.1">

    </div>

    <div>

      <div class="small">回数</div>

      <input class="reps" type="number">

    </div>

  `;

  document.getElementById("setRows").appendChild(row);

}

function saveWorkout(){

  const part=document.getElementById("bodyPart").value;

  const option=

    document.getElementById("exerciseSelect")

      .selectedOptions[0];

  if(!option){

    alert("種目を選択してください");

    return;

  }

  const name=option.value;

  if(!records[selectedDate])

    records[selectedDate]={workouts:[],memo:""};

  if(Array.isArray(records[selectedDate]))

    records[selectedDate]={

      workouts:records[selectedDate],

      memo:""

    };

  if(part==="有酸素"){

    records[selectedDate].workouts.push({

      type:"cardio",

      bodyPart:part,

      name:name,

      distance:document.getElementById("distance").value,

      time:document.getElementById("time").value,

      calories:document.getElementById("calories").value,

      memo:document.getElementById("cardioMemo").value

    });

  }else{

    const weights=

      [...document.querySelectorAll(".weight")]

        .map(x=>x.value);

    const reps=

      [...document.querySelectorAll(".reps")]

        .map(x=>x.value);

    const sets=[];

    for(let i=0;i<weights.length;i++){

      if(weights[i]!=="" || reps[i]!==""){

        sets.push({

          weight:weights[i],

          reps:reps[i]

        });

      }

    }

    if(!sets.length){

      alert("重量または回数を入力してください");

      return;

    }

    records[selectedDate].workouts.push({

      type:"strength",

      bodyPart:part,

      name:name,

      equipment:option.dataset.equipment || "",

      sets:sets,

      memo:document.getElementById("exerciseMemo").value

    });

  }

  saveJSON("kintoreData",records);

  closeModal("workoutModal");

  renderRecord();

  renderCalendar();

}

function deleteWorkout(index){

  if(!confirm("この記録を削除しますか？"))

    return;

  const day=records[selectedDate];

  if(Array.isArray(day)){

    day.splice(index,1);

    if(!day.length)

      delete records[selectedDate];

  }else{

    day.workouts.splice(index,1);

    if(!day.workouts.length && !day.memo)

      delete records[selectedDate];

  }

  saveJSON("kintoreData",records);

  renderRecord();

  renderCalendar();

}

function saveMemo(){

  if(!records[selectedDate])

    records[selectedDate]={workouts:[],memo:""};

  if(Array.isArray(records[selectedDate]))

    records[selectedDate]={

      workouts:records[selectedDate],

      memo:""

    };

  records[selectedDate].memo=

    document.getElementById("dayMemo").value;

  saveJSON("kintoreData",records);

  renderCalendar();

  alert("メモを保存しました");

}

function copyPrevious(){

  const dates=Object.keys(records)

    .filter(d=>d<selectedDate)

    .sort();

  if(!dates.length){

    alert("前回の記録がありません");

    return;

  }

  const previous=dates[dates.length-1];

  const source=records[previous];

  let workouts=

    Array.isArray(source)

      ? source

      : source.workouts || [];

  if(!records[selectedDate])

    records[selectedDate]={workouts:[],memo:""};

  if(Array.isArray(records[selectedDate]))

    records[selectedDate]={

      workouts:records[selectedDate],

      memo:""

    };

  const copied=JSON.parse(JSON.stringify(workouts));

  records[selectedDate].workouts=

    records[selectedDate].workouts.concat(copied);

  saveJSON("kintoreData",records);

  renderRecord();

  renderCalendar();

  alert(previous+" の記録をコピーしました");

}

function showMenuModal(index=null){

  document.getElementById("menuModal").classList.remove("hidden");

  if(index===null){

    document.getElementById("menuModalTitle").textContent="種目追加";

    document.getElementById("editMenuIndex").value="";

    document.getElementById("menuBodyPart").value="胸";

    document.getElementById("menuName").value="";

    document.getElementById("menuEquipment").value="マシン";

  }else{

    const item=getAllMenus()[index];

    document.getElementById("menuModalTitle").textContent="種目編集";

    document.getElementById("editMenuIndex").value=index;

    document.getElementById("menuBodyPart").value=item.part;

    document.getElementById("menuName").value=item.name;

    document.getElementById("menuEquipment").value=item.equipment;

  }

}

function getAllMenus(){

  const result=[];

  Object.keys(menus).forEach(part=>{

    (menus[part]||[]).forEach(item=>{

      result.push({

        part:part,

        name:item[0],

        equipment:item[1] || ""

      });

    });

  });

  return result;

}

function saveMenu(){

  const part=document.getElementById("menuBodyPart").value;

  const name=document.getElementById("menuName").value.trim();

  const equipment=document.getElementById("menuEquipment").value;

  if(!name){

    alert("種目名を入力してください");

    return;

  }

  const edit=

    document.getElementById("editMenuIndex").value;

  if(edit===""){

    if(!menus[part])

      menus[part]=[];

    menus[part].push([name,equipment]);

  }else{

    const all=getAllMenus();

    const old=all[Number(edit)];

    menus[old.part]=menus[old.part].filter(

      x=>x[0]!==old.name

    );

    if(!menus[part])

      menus[part]=[];

    menus[part].push([name,equipment]);

  }

  saveJSON("kintoreMenus",menus);

  closeModal("menuModal");

  renderMenus();

}

function deleteMenu(part,name){

  if(!confirm(name+"を削除しますか？"))

    return;

  menus[part]=menus[part].filter(x=>x[0]!==name);

  saveJSON("kintoreMenus",menus);

  renderMenus();

}

function renderMenus(){

  const box=document.getElementById("menuList");

  box.innerHTML="";

  const all=getAllMenus();

  if(!all.length){

    box.innerHTML=`<div class="card">種目がありません。</div>`;

    return;

  }

  all.forEach((item,index)=>{

    const div=document.createElement("div");

    div.className="card";

    div.innerHTML=`

      <div class="exercise-head">

        <div>

          <b>${escapeHTML(item.name)}</b><br>

          <span class="badge">${escapeHTML(item.part)}</span>

          <span class="badge">${escapeHTML(item.equipment)}</span>

        </div>

        <div>

          <button class="secondary"

            onclick="showMenuModal(${index})">

            編集

          </button>

          <button class="danger"

            onclick="deleteMenu('${escapeAttr(item.part)}','${escapeAttr(item.name)}')">

            削除

          </button>

        </div>

      </div>

    `;

    box.appendChild(div);

  });

}

function showTemplateModal(){

  document.getElementById("templateName").value="";

  const box=document.getElementById("templateExercises");

  box.innerHTML="";

  getAllMenus().forEach((item,index)=>{

    const label=document.createElement("label");

    label.style.fontWeight="normal";

    label.innerHTML=`

      <input type="checkbox"

        value="${index}"

        style="width:auto;margin-right:8px">

      ${escapeHTML(item.name)}

      <span class="small">(${escapeHTML(item.part)})</span>

    `;

    box.appendChild(label);

  });

  document.getElementById("templateModal")

    .classList.remove("hidden");

}

function saveTemplate(){

  const name=

    document.getElementById("templateName").value.trim();

  if(!name){

    alert("メニュー名を入力してください");

    return;

  }

  const selected=

    [...document.querySelectorAll(

      "#templateExercises input:checked"

    )].map(x=>Number(x.value));

  if(!selected.length){

    alert("種目を選択してください");

    return;

  }

  const all=getAllMenus();

  templates.push({

    name:name,

    exercises:selected.map(i=>({

      name:all[i].name,

      part:all[i].part,

      equipment:all[i].equipment

    }))

  });

  saveJSON("kintoreTemplates",templates);

  closeModal("templateModal");

  renderTemplates();

}

function renderTemplates(){

  const box=document.getElementById("templateList");

  box.innerHTML="";

  if(!templates.length){

    box.innerHTML=

      `<p class="small">保存メニューはまだありません。</p>`;

    return;

  }

  templates.forEach((t,index)=>{

    const div=document.createElement("div");

    div.className="list-item";

    div.innerHTML=`

      <b>${escapeHTML(t.name)}</b>

      <div>

        ${(t.exercises||[])

          .map(e=>`<span class="badge">${escapeHTML(e.name)}</span>`)

          .join("")}

      </div>

      <button class="danger"

        style="margin-top:8px"

        onclick="deleteTemplate(${index})">

        削除

      </button>

    `;

    box.appendChild(div);

  });

}

function deleteTemplate(index){

  if(!confirm("この保存メニューを削除しますか？"))

    return;

  templates.splice(index,1);

  saveJSON("kintoreTemplates",templates);

  renderTemplates();

}

function renderAnalysis(){

  const box=document.getElementById("analysis");

  let workoutDays=0;

  let totalSets=0;

  let totalVolume=0;

  let cardioDistance=0;

  Object.values(records).forEach(day=>{

    const workouts=

      Array.isArray(day)

        ? day

        : day.workouts || [];

    if(workouts.length)

      workoutDays++;

    workouts.forEach(w=>{

      if(w.type==="cardio"){

        cardioDistance+=Number(w.distance)||0;

      }else{

        normalizeSets(w.sets).forEach(s=>{

          const weight=Number(s.weight)||0;

          const reps=Number(s.reps)||0;

          if(weight || reps)

            totalSets++;

          totalVolume+=weight*reps;

        });

      }

    });

  });

  box.innerHTML=`

    <p>

      トレーニング日数：

      <b>${workoutDays}</b>日

    </p>

    <p>

      総セット数：

      <b>${totalSets}</b>セット

    </p>

    <p>

      総負荷量：

      <b>${Math.round(totalVolume).toLocaleString()}</b> kg

    </p>

    <p>

      有酸素距離：

      <b>${cardioDistance.toFixed(1)}</b> km

    </p>

    <hr>

    <p class="small">

      ※現在のバージョンではデータはこの端末に保存されます。

    </p>

  `;

}

function hasPR(date){

  const day=records[date];

  const workouts=

    Array.isArray(day)

      ? day

      : day?.workouts || [];

  for(const w of workouts){

    if(w.type==="cardio") continue;

    const sets=normalizeSets(w.sets);

    for(const s of sets){

      const weight=Number(s.weight)||0;

      if(!weight) continue;

      let previousMax=0;

      Object.keys(records)

        .filter(d=>d<date)

        .forEach(d=>{

          const pd=records[d];

          const pws=

            Array.isArray(pd)

              ? pd

              : pd?.workouts || [];

          pws.forEach(pw=>{

            if(pw.name!==w.name) return;

            normalizeSets(pw.sets).forEach(ps=>{

              previousMax=Math.max(

                previousMax,

                Number(ps.weight)||0

              );

            });

          });

        });

      if(weight>previousMax)

        return true;

    }

  }

  return false;

}

function closeModal(id){

  document.getElementById(id).classList.add("hidden");

}

function escapeHTML(value){

  return String(value ?? "")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return String(value ?? "")

    .replaceAll("\\","\\\\")

    .replaceAll("'","\\'");

}

/* モーダル外をタップして閉じる */

document.querySelectorAll(".modal-bg").forEach(bg=>{

  bg.addEventListener("click",e=>{

    if(e.target===bg)

      bg.classList.add("hidden");

  });

});

/* 初期表示 */

document.addEventListener("DOMContentLoaded",()=>{

  renderCalendar();

  updateExerciseSelect();

});

</script>

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>筋トレ記録</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;color:#222}

header{background:#111;color:white;padding:18px;text-align:center;font-size:22px;font-weight:bold}

main{padding:16px;max-width:600px;margin:auto}

.card{background:white;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0001}

h2{margin:0 0 12px}

button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#111;color:white}

input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin:5px 0 10px}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.day{text-align:center;padding:10px 2px;border-radius:10px;background:#eee;min-height:48px}

.today{background:#111;color:white;font-weight:bold}

.done{font-size:11px}

.row{display:flex;gap:8px}

.row>*{flex:1}

.hidden{display:none}

.item{padding:10px;border-bottom:1px solid #eee}

.back{background:#777;margin-bottom:12px}

</style>

</head>

<body>

<header>💪 筋トレ記録</header>

<main>

<section id="calendarScreen">

<div class="card">

<h2 id="monthTitle"></h2>

<div class="calendar" id="calendar"></div>

</div>

<div class="card">

<h2>今日の記録</h2>

<button onclick="openToday()">今日を記録する</button>

</div>

</section>

<section id="recordScreen" class="hidden">

<button class="back" onclick="showCalendar()">← カレンダー</button>

<div class="card">

<h2 id="recordDate"></h2>

<label>部位・種類</label>

<select id="category" onchange="updateExercise()">

<option>胸</option>

<option>背中</option>

<option>肩</option>

<option>腕</option>

<option>脚</option>

<option>腹</option>

<option>有酸素</option>

<option>その他</option>

</select>

<label>種目</label>

<select id="exercise"></select>

<div id="strengthArea">

<div class="row">

<div>

<label>重量 (kg)</label>

<input id="weight" type="number" inputmode="decimal">

</div>

<div>

<label>回数</label>

<input id="reps" type="number" inputmode="numeric">

</div>

<div>

<label>セット</label>

<input id="sets" type="number" value="3" inputmode="numeric">

</div>

</div>

</div>

<div id="cardioArea" class="hidden">

<label>距離 (km)</label>

<input id="distance" type="number" step="0.1">

<label>時間（分）</label>

<input id="time" type="number">

</div>

<label>メモ</label>

<input id="memo" type="text" placeholder="今日の調子など">

<button onclick="saveRecord()">保存する</button>

</div>

<div class="card">

<h2>この日の記録</h2>

<div id="records"></div>

</div>

</section>

</main>

<script>

const exercises={

"胸":["ベンチプレス","チェストプレス","ダンベルプレス","ディップス"],

"背中":["懸垂","ラットプルダウン","ローイング","ワンハンドロー"],

"肩":["ショルダープレス","サイドレイズ","フロントレイズ"],

"腕":["アームカール","ハンマーカール","トライセプスプレスダウン"],

"脚":["スクワット","スミスマシンスクワット","レッグプレス","レッグカール","カーフレイズ"],

"腹":["アブドミナル","レッグレイズ","ケーブルクランチ"],

"有酸素":["ランニング","ジョギング","ウォーキング","サイクリング","水泳","その他"],

"その他":["その他"]

};

let selectedDate=new Date();

let data=JSON.parse(localStorage.getItem("kintoreData")||"{}");

function dateKey(d){

return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

}

function showCalendar(){

document.getElementById("calendarScreen").classList.remove("hidden");

document.getElementById("recordScreen").classList.add("hidden");

drawCalendar();

}

function drawCalendar(){

let y=selectedDate.getFullYear(),m=selectedDate.getMonth();

document.getElementById("monthTitle").textContent=y+"年 "+(m+1)+"月";

let cal=document.getElementById("calendar");

cal.innerHTML="";

["日","月","火","水","木","金","土"].forEach(x=>{

let e=document.createElement("div");

e.textContent=x;

e.style.textAlign="center";

e.style.fontWeight="bold";

cal.appendChild(e);

});

let first=new Date(y,m,1).getDay();

let days=new Date(y,m+1,0).getDate();

for(let i=0;i<first;i++)cal.appendChild(document.createElement("div"));

for(let d=1;d<=days;d++){

let date=new Date(y,m,d),key=dateKey(date);

let e=document.createElement("div");

e.className="day";

if(key===dateKey(new Date()))e.classList.add("today");

e.innerHTML=d+(data[key]&&data[key].length?"<div class='done'>🔥</div>":"");

e.onclick=()=>openRecord(date);

cal.appendChild(e);

}

}

function openToday(){openRecord(new Date())}

function openRecord(date){

selectedDate=date;

document.getElementById("calendarScreen").classList.add("hidden");

document.getElementById("recordScreen").classList.remove("hidden");

document.getElementById("recordDate").textContent=

date.getFullYear()+"年"+(date.getMonth()+1)+"月"+date.getDate()+"日の記録";

updateExercise();

showRecords();

}

function updateExercise(){

let cat=document.getElementById("category").value;

let ex=document.getElementById("exercise");

ex.innerHTML="";

exercises[cat].forEach(x=>{

let o=document.createElement("option");

o.textContent=x;

ex.appendChild(o);

});

let cardio=cat==="有酸素";

document.getElementById("strengthArea").classList.toggle("hidden",cardio);

document.getElementById("cardioArea").classList.toggle("hidden",!cardio);

}

function saveRecord(){

let key=dateKey(selectedDate);

if(!data[key])data[key]=[];

let cat=document.getElementById("category").value;

let rec={

category:cat,

exercise:document.getElementById("exercise").value,

weight:document.getElementById("weight").value,

reps:document.getElementById("reps").value,

sets:document.getElementById("sets").value,

distance:document.getElementById("distance").value,

time:document.getElementById("time").value,

memo:document.getElementById("memo").value

};

data[key].push(rec);

localStorage.setItem("kintoreData",JSON.stringify(data));

document.getElementById("memo").value="";

showRecords();

alert("保存しました！💪");

}

function showRecords(){

let key=dateKey(selectedDate);

let box=document.getElementById("records");

box.innerHTML="";

(data[key]||[]).forEach((r,i)=>{

let e=document.createElement("div");

e.className="item";

if(r.category==="有酸素"){

e.innerHTML="🏃 "+r.exercise+"　"+(r.distance||"-")+"km / "+(r.time||"-")+"分"+

(r.memo?"<br>📝 "+r.memo:"");

}else{

e.innerHTML="🏋️ "+r.exercise+"　"+(r.weight||"-")+"kg × "+(r.reps||"-")+"回 × "+(r.sets||"-")+"set"+

(r.memo?"<br>📝 "+r.memo:"");

}

box.appendChild(e);

});

if(!data[key])box.innerHTML="まだ記録はありません";

}

drawCalendar();

updateExercise();

</script>

</body>

</html>
